  DpvExample:
    name: DpvExample
    definition_uri: https://w3id.org/lmodel/dpv/DpvExample
    description: 'One of DPV''s examples: what it shows, and the statements its Turtle
      file makes, as one resource per subject.'
    title: Example
    comments:
    - Every file leaves its prefixes out, so a parser reads it with the prefixes of
      the vocabularies beside it. An example may show two ways of saying one thing,
      so its resources are what the file states, not one consistent account.
    from_schema: https://w3id.org/lmodel/dpv/dpv_terms
    exact_mappings:
    - dex:Example
    slots:
    - id
    - DpvExample_title
    - description
    - format
    - source
    - subject
    - created
    - modified
    - temporal
    - contributor
    - term_status
    - dpvExample__turtle_fault
    - dpvExample__resources
    slot_usage:
      title:
        name: title
        required: true
    attributes:
      turtle_fault:
        name: turtle_fault
        description: What stops a parser reading the example's file, where the file
          does not parse.
        title: Turtle Fault
      resources:
        name: resources
        description: Each subject the example's file states, with what it says about
          it.
        title: Resources
        range: DpvResource
        multivalued: true
        inlined_as_list: true
    class_uri: dex:Example
  DpvStatement:
    name: DpvStatement
    definition_uri: https://w3id.org/lmodel/dpv/DpvStatement
    description: 'One statement of a resource that its keys cannot hold: a predicate
      with no slot, or a value not in the form its slot takes.'
    title: Statement
    from_schema: https://w3id.org/lmodel/dpv/dpv_terms
    slots:
    - datatype
    - dpvStatement__predicate
    - dpvStatement__reference
    - dpvStatement__literal
    - dpvStatement__language
    attributes:
      predicate:
        name: predicate
        description: The predicate, as a CURIE or an IRI.
        title: Predicate
        slot_uri: rdf:predicate
        range: uriorcurie
        required: true
        pattern: ^[A-Za-z_][A-Za-z0-9_+.-]*:\S*$
      reference:
        name: reference
        description: The object, when it names a resource.
        title: Reference
        slot_uri: rdf:object
        range: uriorcurie
        pattern: ^[A-Za-z_][A-Za-z0-9_+.-]*:\S*$
      literal:
        name: literal
        description: The object, when it is a literal, in its lexical form.
        title: Literal
        slot_uri: rdf:value
      language:
        name: language
        description: The literal's language tag.
        title: Language
    class_uri: dpv_linkml:DpvStatement
