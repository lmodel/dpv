classes:
  DpvCatalogue:
    name: DpvCatalogue
    definition_uri: https://w3id.org/lmodel/dpv/DpvCatalogue
    description: 'One part of a DPV release: one namespace family''s vocabularies
      and terms, its contributors or its examples.'
    title: Catalogue
    from_schema: https://w3id.org/lmodel/dpv
    slots:
    - concepts
    - dpvCatalogue__edition
    - dpvCatalogue__family
    - dpvCatalogue__vocabularies
    - dpvCatalogue__concept_schemes
    - dpvCatalogue__properties
    - dpvCatalogue__agents
    - dpvCatalogue__examples
    attributes:
      edition:
        name: edition
        description: The DPV release the part belongs to.
        title: Edition
        slot_uri: dcterms:isVersionOf
        required: true
      family:
        name: family
        description: Which part of the release this is.
        title: Family
        range: DpvFamily
        required: true
      vocabularies:
        name: vocabularies
        description: The family's vocabularies, as each one's Turtle file describes
          it.
        title: Vocabularies
        range: DpvVocabulary
        multivalued: true
        inlined_as_list: true
      concept_schemes:
        name: concept_schemes
        description: The lists of terms the family's vocabularies keep.
        title: Concept Schemes
        range: DpvConceptScheme
        multivalued: true
        inlined_as_list: true
      properties:
        name: properties
        description: The family's properties.
        title: Properties
        range: DpvProperty
        multivalued: true
        inlined_as_list: true
      agents:
        name: agents
        description: The people and organizations DPV names as contributors.
        title: Agents
        range: DpvAgent
        multivalued: true
        inlined_as_list: true
      examples:
        name: examples
        description: DPV's examples.
        title: Examples
        range: DpvExample
        multivalued: true
        inlined_as_list: true
    class_uri: dpv_linkml:DpvCatalogue
    tree_root: true
  DpvVocabulary:
    name: DpvVocabulary
    definition_uri: https://w3id.org/lmodel/dpv/DpvVocabulary
    description: One of DPV's vocabularies, as its own Turtle file's header describes
      it.
    title: Vocabulary
    from_schema: https://w3id.org/lmodel/dpv/dpv_core
    exact_mappings:
    - owl:Ontology
    slots:
    - id
    - title
    - description
    - identifier
    - bibliographicCitation
    - conformsTo
    - created
    - issued
    - modified
    - creator
    - contributor
    - publisher
    - license
    - source
    - doi
    - bibo_status
    - preferredNamespacePrefix
    - preferredNamespaceUri
    - rdfs_Label
    - versionIRI
    - versionInfo
    - schema_version
    - isProfileOf
    - logo
    class_uri: owl:Ontology
  DpvConceptScheme:
    name: DpvConceptScheme
    definition_uri: https://w3id.org/lmodel/dpv/DpvConceptScheme
    description: A list of terms DPV keeps within a vocabulary. DPV states nothing
      else about one.
    title: Concept Scheme
    from_schema: https://w3id.org/lmodel/dpv/dpv_core
    exact_mappings:
    - skos:ConceptScheme
    slots:
    - id
    class_uri: skos:ConceptScheme
  DpvAgent:
    name: DpvAgent
    definition_uri: https://w3id.org/lmodel/dpv/DpvAgent
    description: A person or an organization DPV names as a contributor, as DPV's
      files describe them.
    title: Agent
    from_schema: https://w3id.org/lmodel/dpv/dpv_core
    exact_mappings:
    - dcterms:Agent
    slots:
    - DpvAgent_id
    - name
    - homepage
    - memberOf
    - dpvAgent__hasORCID
    slot_usage:
      id:
        name: id
        pattern: ^dpv_agent:(person|org)-[a-z0-9-]+$
    attributes:
      hasORCID:
        name: hasORCID
        description: The person's ORCID identifier.
        title: ORCID
        slot_uri: scoro:hasORCID
    class_uri: dcterms:Agent
  DpvWebPage:
    name: DpvWebPage
    definition_uri: https://w3id.org/lmodel/dpv/DpvWebPage
    description: A web page DPV names as a term's source.
    title: Web Page
    from_schema: https://w3id.org/lmodel/dpv/dpv_core
    exact_mappings:
    - sdo:WebPage
    slots:
    - url
    - dpvWebPage__page_name
    attributes:
      page_name:
        name: page_name
        description: The page's title.
        title: Page Name
        slot_uri: sdo:name
        required: true
    class_uri: sdo:WebPage
  DpvInterval:
    name: DpvInterval
    definition_uri: https://w3id.org/lmodel/dpv/DpvInterval
    description: A period of time, with the dates that start and end it.
    title: Interval
    from_schema: https://w3id.org/lmodel/dpv/dpv_core
    exact_mappings:
    - time:ProperInterval
    slots:
    - dpvInterval__hasBeginning
    - dpvInterval__hasEnd
    attributes:
      hasBeginning:
        name: hasBeginning
        description: The date the period starts.
        title: Has Beginning
        slot_uri: time:hasBeginning
