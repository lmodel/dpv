    from_schema: https://w3id.org/lmodel/dpv
    permissible_values:
      core:
        text: core
        description: The vocabulary at https://w3id.org/dpv and the terms it adopts
          from others.
        title: Core
      pd:
        text: pd
        description: The personal data vocabulary.
        title: Personal Data
      tech:
        text: tech
        description: The technology vocabulary.
        title: Technology
      ai:
        text: ai
        description: The artificial intelligence vocabulary.
        title: Artificial Intelligence
      risk:
        text: risk
        description: The risk vocabulary.
        title: Risk
      justifications:
