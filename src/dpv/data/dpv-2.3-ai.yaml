    definition: Capability involving automated recognition of physical, physiological and behavioural
      human features such as the face, eye movement, body shape, voice, prosody, gait, posture, heart
      rate, blood pressure, odour, keystrokes characteristics, for the purpose of establishing an individual’s
      identity by comparing biometric data of that individual to stored biometric data of individuals
      in a reference database, irrespective of whether the individual has given its consent or not
    broader:
      - ai:BiometricCapability
      - ai:HumanIdentification
    inScheme:
      - ai:capabilities-classes
    isDefinedBy:
      - 'ai:'
    term_status: accepted
    created:
