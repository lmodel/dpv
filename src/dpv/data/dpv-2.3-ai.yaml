concepts:
  - id: ai:AGI
    prefLabel: Artificial General Intelligence (AGI)
    definition: Type of AI system that addresses a broad range of tasks with a satisfactory level of performance
    broader:
      - ai:AISystem
    inScheme:
      - ai:systems-classes
    isDefinedBy:
      - 'ai:'
    subClassOf:
      - ai:AISystem
    term_status: accepted
    created:
      - '2024-12-01'
    contributor:
      - dpv_agent:person-delaram-golpayegani
    source:
      - ISO/IEC 22989:2022
  - id: ai:AI
    prefLabel: Artificial Intelligence (AI)
    definition: A technical and scientific field devoted to the engineered system that generates outputs
      such as content, forecasts, recommendations or decisions for a given set of human-defined objectives
    broader:
      - dpv:Technology
    inScheme:
      - ai:core-classes
    isDefinedBy:
      - 'ai:'
    subClassOf:
      - dpv:Technology
    term_status: accepted
    created:
      - '2024-04-28'
    contributor:
      - dpv_agent:person-delaram-golpayegani
    source:
      - ISO/IEC 22989:2022
  - id: ai:AIAgent
    prefLabel: AI Agent
    definition: An AI Agent, also known as an 'intelligent agent', is a software agent that utilises AI
      technologies
    scopeNote:
      - Other definitions of AI Agents may include the perception of environment as some capacity to incorporate
        the environment through sensors (e.g. computer vision) or data (e.g. web environments), and to
        produce changes in outputs through some degree of autonomy (i.e. without human intervention).
        The definition of 'AI Agent' provided in this extension relaxes such requirements and instead
        focuses on classifying these agents based solely on their use of AI technologies to allow compatibility
        with the evolving definitions
    broader:
      - ai:AI
      - tech:SoftwareAgent
    inScheme:
      - ai:core-classes
    isDefinedBy:
      - 'ai:'
    subClassOf:
      - ai:AI
      - tech:SoftwareAgent
    term_status: accepted
    created:
      - '2025-10-28'
    contributor:
      - dpv_agent:person-harshvardhan-j-pandit
  - id: ai:AIBias
    rdf_type:
      - dpv:RiskConcept
      - risk:PotentialRisk
      - risk:PotentialRiskSource
    prefLabel: AI Bias
    definition: Bias associated with development, use, or other activities involving an AI technology
      or system
    broader:
      - ai:RiskConcept
      - risk:Bias
    inScheme:
      - ai:risks-classes
    isDefinedBy:
      - 'ai:'
    term_status: accepted
    created:
      - '2024-09-18'
    contributor:
      - dpv_agent:person-daniel-doherty
      - dpv_agent:person-delaram-golpayegani
  - id: ai:AIProcess
    prefLabel: AI Process
    definition: A process involving AI technologies
    scopeNote:
      - This concept provides a convenient method to indicate AI is involved (somewhere) within the Process
    broader:
      - dpv:Process
    inScheme:
      - ai:core-classes
    isDefinedBy:
      - 'ai:'
    subClassOf:
      - dpv:Process
    term_status: accepted
    contributor:
      - dpv_agent:person-harshvardhan-j-pandit
  - id: ai:AISystem
    prefLabel: AI System
    definition: An engineered system that generates outputs such as content, forecasts, recommendations
      or decisions for a given set of human-defined objectives (ISO/IEC 22989:2022 definition); or A machine-based
      system that, for explicit or implicit objectives, infers, from the input it receives, how to generate
      outputs such as predictions, content, recommendations, or decisions that can influence physical
      or virtual environments. Different AI systems vary in their levels of autonomy and adaptiveness
      after deployment (OECD 2024 definition); or A machine-based system demonstrating varying degrees
      of autonomy and adaptiveness after deployment, generating outputs such as predictions, content,
      recommendations, or decisions to influence physical or virtual environments (EU Vocabularies' AI
      Taxonomy definition)
    broader:
      - ai:AI
      - tech:System
    inScheme:
      - ai:core-classes
    isDefinedBy:
      - 'ai:'
    subClassOf:
      - ai:AI
      - tech:System
    term_status: accepted
    created:
      - '2024-05-17'
    contributor:
      - dpv_agent:person-delaram-golpayegani
    source:
      - ' ISO/IEC 22989:2022'
      - OECD.AI
  - id: ai:AISystemRisk
    rdf_type:
