    rdf_type:
      - dpv:RiskConcept
      - risk:PotentialRisk
      - risk:PotentialRiskSource
    prefLabel: Informativeness Bias
    definition: Bias that occurs or some groups, the mapping between inputs present in the data and outputs
      are more difficult to learn and where a model that only has one feature set available, can be biased
      against the group whose relationships are difficult to learn from available data
    scopeNote:
      - This can happen when some features are highly informative about one group, while a different set
        of features is highly informative about another group. If this is the case, then a model that
        only has one feature set available, can be biased against the group whose relationships are difficult
        to learn from available data
    broader:
      - ai:EngineeringDecisionBias
    inScheme:
      - ai:risks-classes
    isDefinedBy:
