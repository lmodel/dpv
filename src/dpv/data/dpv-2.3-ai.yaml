  - id: ai:Capability
    prefLabel: Capability
    definition: Capability or use of AI to achieve a technical goal or objective
    scopeNote:
      - This concept refers to the application of an AI technique to achieve a technical goal or function,
        and is necessary to distinguish the 'algorithm' (ai:Technique) from the 'application' (ai:Capability)
        and 'goal' (dpv:Purpose)
    broader:
      - ai:AI
    inScheme:
      - ai:core-classes
    isDefinedBy:
      - 'ai:'
    subClassOf:
      - ai:AI
    term_status: accepted
    created:
      - '2024-04-28'
    contributor:
      - dpv_agent:person-delaram-golpayegani
