  - id: dpv:HumanOversight
    rdf_type:
      - dpv:OrganisationalMeasure
    prefLabel: Human Oversight
    definition: Procedures related to implementing and ensuring human oversight, which includes ability
      for humans to oversee, understand, control, and reverse processes, and to have sufficient monitoring
      capability to detect and address anomalies, dysfunctions, or unexpected performance
    scopeNote:
      - DPV also provides a taxonomy for 'Entity Involvement' including specific forms of 'Human Involvement'
        which allow expressing the roles of humans in specific capacities such as oversight, controls,
        and whether they have the ability to do something or don't. The Human Oversight as an organisational
        measure represents the overall plans and procedures for implementation of such human involvement
    broader:
      - dpv:GovernanceProcedures
    inScheme:
      - dpv:organisational-measures-classes
    isDefinedBy:
      - 'dpv:'
    term_status: accepted
    created:
      - '2026-02-09'
    contributor:
      - dpv_agent:person-delaram-golpayegani
      - dpv_agent:person-harshvardhan-j-pandit
