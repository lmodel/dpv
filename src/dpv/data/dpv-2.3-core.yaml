  - id: dpv:SensitivePersonalData
    prefLabel: Sensitive Personal Data
    definition: Personal data that is considered 'sensitive' in terms of privacy and/or impact, and therefore
      requires additional considerations and/or protection
    scopeNote:
      - Sensitivity' is a matter of context, and may be defined within legal frameworks. For GDPR, Special
        categories of personal data are considered a subset of sensitive data. To illustrate the difference
        between the two, consider the situation where Location data is collected, and which is considered
        'sensitive' but not 'special'. As a probable rule, sensitive data require additional considerations
        whereas special category data requires additional legal basis / justifications.
    broader:
      - dpv:PersonalData
      - dpv:SensitiveData
    inScheme:
      - dpv:personal-data-classes
    isDefinedBy:
      - 'dpv:'
    subClassOf:
      - dpv:PersonalData
      - dpv:SensitiveData
    example:
      - dex:E0010
      - dex:E0045
    term_status: accepted
    created:
      - '2022-01-19'
    contributor:
      - dpv_agent:person-harshvardhan-j-pandit
  - id: dpv:SensitivityLevel
    prefLabel: Sensitivity Level
    definition: Sensitivity' reflects the risk of impact if not secured or utilised with appropriate measures
      and controls e.g. for sensitive data
    scopeNote:
      - ISO/IEC TS 38505-3:2021 defines 'data sensitivity' as the potential harm of unauthorised disclosure.
        DPV's use of the concept goes beyond disclosure as it refers to the level of safeguards or controls
        the data requires as a reflection of its 'sensitive' nature. To indicate quantified levels of
        sensitivity, e.g. "high sensitivity", instances of severity can be directly used or specialised
    broader:
      - dpv:Severity
    inScheme:
      - dpv:risk-classes
    isDefinedBy:
      - 'dpv:'
    subClassOf:
      - dpv:Severity
    term_status: accepted
    created:
      - '2023-08-24'
    contributor:
      - dpv_agent:person-harshvardhan-j-pandit
