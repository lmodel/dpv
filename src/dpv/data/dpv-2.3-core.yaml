    definition: Notice provided regarding non-fulfilment of a right
    scopeNote:
      - This notice is associated with situations where information is provided with the intention of
        communicating non-fulfilment of a right. For example, to provide justifications on why a right
        could not be fulfilled or providing information about another entity who should be approached
        for exercising this right.
