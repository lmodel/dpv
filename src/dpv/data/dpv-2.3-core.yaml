    definition: Human involvement for the purposes of verification of specified context to ensure its
      operations, inputs, or outputs are correct or are acceptable.
    scopeNote:
      - Verification by itself does not imply ability to Control, Intervene, or having Oversight.
    broader:
      - dpv:HumanInvolvement
    inScheme:
