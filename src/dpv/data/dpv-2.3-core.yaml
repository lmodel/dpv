  - id: dpv:UnknownApplicability
    rdf_type:
      - dpv:Applicability
    prefLabel: Unknown Applicability
    definition: Concept indicating information or context availability is unknown i.e. it is not known
      if the information exists or is applicable and therefore statements about its availability cannot
      be made (yet)
    scopeNote:
      - This concept is useful when describing situations where it cannot be stated whether the context
        applies or whether the information is not available yet. For example, if a form field asks about
        whether a process X was completed and it is not yet known whether X applies or not and therefore
        it is also unclear whether X was completed or not. Using UnknownApplicability is a signal that
        the applicability of X should be assessed, and if applicable, then information about X should
        be identified and used here.
    broader:
      - dpv:Applicability
    inScheme:
      - dpv:context-classes
    isDefinedBy:
