  - id: dpv:ExplicitlyExpressedConsent
    rdf_type:
      - dpv:LegalBasis
    prefLabel: Explicitly Expressed Consent
    definition: Consent that is expressed through an explicit action solely conveying a consenting decision
    scopeNote:
      - Explicitly expressed consent is a more specific form of Expressed consent where the action taken
        must 'explicitly' relate to only the consent decision. Expressed consent where the consenting
        is part of other matters therefore cannot satisfy the requirements of explicitly expressed consent.
        An example of explicit action expressing the consenting decision is a button on a web form where
        the form only relates to consent, or it is accompanied with suitable text that reiterates what
        the consenting decision is about
    broader:
      - dpv:ExpressedConsent
    inScheme:
      - dpv:consent-types-classes
    isDefinedBy:
      - 'dpv:'
    example:
      - dex:E0018
    term_status: accepted
    created:
      - '2022-06-21'
    contributor:
      - dpv_agent:person-georg-p-krog
      - dpv_agent:person-harshvardhan-j-pandit
      - dpv_agent:person-julian-flake
      - dpv_agent:person-paul-ryan
