properties:
  - id: dcterms:accessRights
    prefLabel: dct:accessRights
    scopeNote:
      - Also used for specifying constraints on access associated with Rights Exercising (e.g. User must
        log in) or access to provided data (e.g. access via link)
    inScheme:
      - dpv:rights-properties
    isDefinedBy:
      - 'dpv:'
  - id: dcterms:conformsTo
    prefLabel: dct:conformsTo
    scopeNote:
      - For expressing an existing standard, guideline, or requirements to which the DPIA document or
        process will be conforming to. This could be external guidelines published by an Authority, or
        internal guidelines established by the organisation
    inScheme:
      - eu-gdpr:dpia-properties
    isDefinedBy:
      - 'eu-gdpr:'
  - id: dcterms:coverage
    prefLabel: dct:coverage
    scopeNote:
      - For expressing coverage (e.g. jurisdictions, products, services) of the DPIA document or process.
        For temporal coverage, please see dct:temporal. The coverage can be expressed using dpv:Process,
        or using another concept, or even be a link or reference to a document, or a textual description
    inScheme:
      - eu-gdpr:dpia-properties
    isDefinedBy:
      - 'eu-gdpr:'
  - id: dcterms:created
    prefLabel: dct:created
    scopeNote:
      - For expressing when the documentation (e.g. DPIA Necessity Assessment, or DPIA Procedure, or DPIA
        outcome) was created
    inScheme:
      - eu-gdpr:dpia-properties
    isDefinedBy:
      - 'eu-gdpr:'
  - id: dcterms:dateAccepted
    prefLabel: dct:dateAccepted
    scopeNote:
      - For expressing when the documentation (e.g. DPIA Necessity Assessment, or DPIA Procedure, or DPIA
        outcome) was accepted through audit or approval
    inScheme:
      - eu-gdpr:dpia-properties
    isDefinedBy:
      - 'eu-gdpr:'
  - id: dcterms:dateSubmitted
    prefLabel: dct:dateSubmitted
    scopeNote:
      - For expressing when the documentation (e.g. DPIA Necessity Assessment, or DPIA Procedure, or DPIA
        outcome) was submitted for audit or approval
    inScheme:
      - eu-gdpr:dpia-properties
    isDefinedBy:
      - 'eu-gdpr:'
  - id: dcterms:description
    prefLabel: dct:description
    scopeNote:
      - Indicates a description of the DPIA for human comprehension
    inScheme:
      - eu-gdpr:dpia-properties
    isDefinedBy:
      - 'eu-gdpr:'
  - id: dcterms:format
    prefLabel: dct:format
    scopeNote:
      - Also used for specifying the format of provided information, for example a CSV dataset
    inScheme:
      - dpv:rights-properties
    isDefinedBy:
      - 'dpv:'
  - id: dcterms:hasPart
    prefLabel: dct:hasPart
    scopeNote:
      - Also used for specifying a RightExerciseRecord has RightExerciseActivity as part of its records
      - For expressing something contains a DPIA document or process contains as a part. For example,
        as some dpv:DPIA dct:hasPart DPIANecessityAssessment
    inScheme:
      - dpv:rights-properties
      - eu-gdpr:dpia-properties
    isDefinedBy:
      - 'dpv:'
      - 'eu-gdpr:'
    domainIncludes:
      - dpv:RightExerciseRecord
    rangeIncludes:
      - dpv:RightExerciseActivity
  - id: dcterms:identifier
    prefLabel: dct:identifier
    scopeNote:
      - Indicates an identifier associated with the DPIA documentation or process. Identifiers may be
        reused from existing systems, or created for the purposes of record management
    inScheme:
      - eu-gdpr:dpia-properties
    isDefinedBy:
      - 'eu-gdpr:'
  - id: dcterms:isPartOf
    prefLabel: dct:isPartOf
    scopeNote:
      - Also used for specifying a RightExerciseActivity is part of a RightExerciseRecord
      - For expressing a DPIA document or process is part of another. For example, as some DPIANecessityAssessment
        dct:isPartOf some dpv:DPIA
    inScheme:
      - dpv:rights-properties
      - eu-gdpr:dpia-properties
    isDefinedBy:
      - 'dpv:'
      - 'eu-gdpr:'
    domainIncludes:
      - dpv:RightExerciseActivity
    rangeIncludes:
      - dpv:RightExerciseRecord
  - id: dcterms:isVersionOf
    prefLabel: dct:isVersionOf
    scopeNote:
      - For expressing prior versions or iterations of the DPIA document or process
    inScheme:
      - eu-gdpr:dpia-properties
    isDefinedBy:
      - 'eu-gdpr:'
  - id: dcterms:modified
    prefLabel: dct:modified
    scopeNote:
      - For expressing when the documentation (e.g. DPIA Necessity Assessment, or DPIA Procedure, or DPIA
        outcome) was last modified
    inScheme:
      - eu-gdpr:dpia-properties
    isDefinedBy:
      - 'eu-gdpr:'
  - id: dcterms:subject
    prefLabel: dct:subject
    scopeNote:
      - For expressing the subject of the DPIA document or process, where subject refers to the point
        of focus. For expressing what is affected or included within the DPIA, please see dct:coverage
    inScheme:
      - eu-gdpr:dpia-properties
    isDefinedBy:
      - 'eu-gdpr:'
  - id: dcterms:temporal
    prefLabel: dct:temporal
    scopeNote:
      - For expressing the temporal coverage of the DPIA document or process
    inScheme:
      - eu-gdpr:dpia-properties
    isDefinedBy:
      - 'eu-gdpr:'
  - id: dcterms:title
    prefLabel: dct:title
    scopeNote:
      - Indicates a title of the DPIA for human comprehension
    inScheme:
      - eu-gdpr:dpia-properties
    isDefinedBy:
      - 'eu-gdpr:'
  - id: dcterms:valid
    prefLabel: dct:valid
    scopeNote:
      - Also used for specifying the temporal validity of an activity associated with Right Exercise.
        For example, limits on duration for providing or accessing provided information
      - For expressing the temporal date or range of validity of the DPIA document or process. This refers
        to the time period for which the DPIA is considered valid, and does not refer to the temporal
        period associated with processing (see dct:temporal instead). The assumption is that after this
        period, the DPIA should be re-evaluated or some process should be triggered
    inScheme:
      - dpv:rights-properties
      - eu-gdpr:dpia-properties
    isDefinedBy:
      - 'dpv:'
      - 'eu-gdpr:'
  - id: dpv:hasActiveEntity
    prefLabel: has active entity
    definition: indicates the entity is actively involved in specified context
    broader:
