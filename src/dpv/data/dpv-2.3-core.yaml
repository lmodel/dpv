  - id: dpv:HumanInvolvement
    prefLabel: Human Involvement
    definition: The involvement of humans in specified context
    scopeNote:
      - Human Involvement here broadly refers to any involvement by a human in the context of carrying
        out processing. This may include verification of outcomes, providing input data for making decisions,
        or overseeing activities. To indicate whether humans are involved or not, see relevant concepts
        of dpv:HumanInvolved and dpv:HumanNotInvolved. The term 'Human in the loop' and its varieties
        are absent from DPV due to their contradictory and non-compatible use across different sources.
    broader:
      - dpv:EntityInvolvement
    inScheme:
      - dpv:processing-context-classes
    isDefinedBy:
      - 'dpv:'
    subClassOf:
      - dpv:EntityInvolvement
    example:
      - dex:E0013
      - dex:E0074
    term_status: accepted
    created:
      - '2022-01-26'
    modified: '2024-04-20'
    contributor:
      - dpv_agent:person-harshvardhan-j-pandit
  - id: dpv:HumanInvolvementForControl
    rdf_type:
      - dpv:HumanInvolvement
    prefLabel: Human Involvement for control
    definition: Human involvement for the purposes of exercising control over the specified operations
      in context
    scopeNote:
      - Control is a broad term that can be applied to various stages and operations. It maps to None,
        Assistive, and Partial automation models.
    broader:
      - dpv:HumanInvolvement
    inScheme:
      - dpv:processing-context-classes
    isDefinedBy:
      - 'dpv:'
    term_status: accepted
    created:
      - '2022-09-04'
    modified: '2023-12-10'
  - id: dpv:HumanInvolvementForDecision
    rdf_type:
      - dpv:HumanInvolvement
    prefLabel: Human Involvement for decision
    definition: Human involvement for the purposes of exercising decisions over the specified operations
      in context
    scopeNote:
      - Decisions are about exercising control over the operation, and are distinct from input (data or
        parameters).
    broader:
      - dpv:HumanInvolvement
    inScheme:
      - dpv:processing-context-classes
    isDefinedBy:
      - 'dpv:'
    term_status: accepted
    created:
      - '2022-09-06'
    modified: '2023-12-10'
  - id: dpv:HumanInvolvementForInput
    rdf_type:
      - dpv:HumanInvolvement
    prefLabel: Human Involvement for Input
    definition: Human involvement for the purposes of providing inputs to the specified context
    scopeNote:
      - Inputs can be in the form of data or other resources.
    broader:
      - dpv:HumanInvolvement
    inScheme:
      - dpv:processing-context-classes
    isDefinedBy:
      - 'dpv:'
    term_status: accepted
    created:
      - '2022-09-07'
    modified: '2023-12-10'
    contributor:
      - dpv_agent:person-harshvardhan-j-pandit
  - id: dpv:HumanInvolvementForIntervention
    rdf_type:
      - dpv:HumanInvolvement
    prefLabel: Human Involvement for intervention
    definition: Human involvement for the purposes of exercising interventions over the specified operations
      in context
    scopeNote:
      - Intervention indicates the ability to intervene in operations, which can be at various stages.
        It maps to Conditional and High automation models.
    broader:
      - dpv:HumanInvolvement
    inScheme:
      - dpv:processing-context-classes
    isDefinedBy:
      - 'dpv:'
    term_status: accepted
    created:
      - '2022-09-05'
    modified: '2023-12-10'
  - id: dpv:HumanInvolvementForOversight
    rdf_type:
      - dpv:HumanInvolvement
    prefLabel: Human Involvement for Oversight
    definition: Human involvement for the purposes of having oversight over the specified context regarding
      its operations, inputs, or outputs
    scopeNote:
      - Oversight by itself does not indicate the ability to intervene or control the operations.
    broader:
