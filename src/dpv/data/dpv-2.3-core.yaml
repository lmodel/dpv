    prefLabel: Purpose
    definition: Purpose or (broader) Goal associated with data or technology
    scopeNote:
      - The purpose or goal here is intended to sufficiently describe the intention or objective of why
        the data or technology is being used, and should be broader than mere technical descriptions of
        achieving a capability. For example, "Analyse Data" is an abstract purpose with no indication
        of what the analyses is for as compared to a purpose such as "Marketing" or "Service Provision"
        which provide clarity and comprehension of the 'purpose' and can be enhanced with additional descriptions.
        Such modelling is in line with regulatory requirements regarding the specificity of purposes,
        for example in GDPR
