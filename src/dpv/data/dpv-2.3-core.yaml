concepts:
  - id: dcat:Resource
    prefLabel: dcat:Resource
    scopeNote:
      - A dataset or catalogue or any other resource provided in fulfilment of a Right Exercise, such
        as for GDPR's Art.15 regarding Right of Access or Art.20 regarding Right to Data Portability.
        The associated properties from DCAT and DCMI DCT vocabularies provide convenient means to express
        metadata such as URL for accessing the data, its temporal validity and access restrictions, and
        specific datasets present along with their schemas.
      - A dataset, data service, or any other resource associated with Right Exercise - such as for providing
        a copy of data
    inScheme:
      - dpv:rights-classes
      - eu-gdpr:rights-classes
    isDefinedBy:
      - 'dpv:'
      - 'eu-gdpr:'
    created:
      - '2022-11-02'
      - '2022-11-09'
    contributor:
      - dpv_agent:person-beatriz-esteves
      - dpv_agent:person-georg-p-krog
      - dpv_agent:person-harshvardhan-j-pandit
  - id: dpv:AIGovernance
    rdf_type:
      - dpv:OrganisationalMeasure
    prefLabel: AI Governance
    definition: Procedures related to governance of AI, including its procurement, development, deployment,
      and assessments
    broader:
      - dpv:GovernanceProcedures
    inScheme:
      - dpv:organisational-measures-classes
    isDefinedBy:
      - 'dpv:'
    term_status: accepted
    created:
      - '2026-02-09'
    contributor:
      - dpv_agent:person-delaram-golpayegani
      - dpv_agent:person-harshvardhan-j-pandit
  - id: dpv:AILiteracy
    rdf_type:
      - dpv:OrganisationalMeasure
    prefLabel: AI Literacy
    definition: Providing skills, knowledge, and understanding to enable reading, writing, analysing,
      reasoning, and communicating regarding AI
    broader:
      - dpv:DigitalLiteracy
    inScheme:
      - dpv:organisational-measures-classes
    isDefinedBy:
      - 'dpv:'
    term_status: accepted
    created:
      - '2024-05-17'
    contributor:
      - dpv_agent:person-harshvardhan-j-pandit
  - id: dpv:AINotice
    rdf_type:
      - dpv:OrganisationalMeasure
    prefLabel: AI Notice
    definition: A notice providing information regarding the particulars of an AI system such as its intended
      purpose and proper use
    broader:
      - dpv:Notice
    inScheme:
      - dpv:organisational-measures-classes
    isDefinedBy:
      - 'dpv:'
    term_status: accepted
    created:
      - '2024-12-01'
    contributor:
      - dpv_agent:person-delaram-golpayegani
  - id: dpv:AcademicResearch
    rdf_type:
      - dpv:Purpose
    prefLabel: Academic Research
    definition: Purposes associated with conducting or assisting with research conducted in an academic
      context e.g. within universities
    broader:
      - dpv:ResearchAndDevelopment
    related:
      - svpu:Education
    inScheme:
      - dpv:purposes-classes
    isDefinedBy:
      - 'dpv:'
    term_status: accepted
    created:
      - '2019-04-05'
    contributor:
      - dpv_agent:person-axel-polleres
      - dpv_agent:person-elmar-kiesling
      - dpv_agent:person-fajar-ekaputra
      - dpv_agent:person-harshvardhan-j-pandit
      - dpv_agent:person-javier-fernandez
      - dpv_agent:person-simon-steyskal
  - id: dpv:AcademicScientificOrganisation
    prefLabel: Academic or Scientific Organisation
    definition: Organisations related to academia or scientific pursuits e.g. Universities, Schools, Research
      Bodies
    broader:
      - dpv:Organisation
    inScheme:
      - dpv:entities-organisation-classes
    isDefinedBy:
      - 'dpv:'
    subClassOf:
      - dpv:Organisation
    term_status: accepted
    created:
      - '2022-02-02'
    modified: '2020-10-05'
    contributor:
      - dpv_agent:person-harshvardhan-j-pandit
    source_page:
      - page_name: ADMS controlled vocabulary
        url: http://purl.org/adms
  - id: dpv:AcceptContract
    prefLabel: Accept Contract
    definition: Control for accepting a contract
    broader:
      - dpv:ContractControl
    inScheme:
      - dpv:contract-control-classes
    isDefinedBy:
      - 'dpv:'
    subClassOf:
      - dpv:ContractControl
    term_status: accepted
    created:
      - '2024-08-27'
  - id: dpv:AcceptableRule
    rdf_type:
      - dpv:Rule
    prefLabel: Acceptable Rule
    definition: A rule that is acceptable where it is either desirable if it occurs or it is not unacceptable
      if it does
    scopeNote:
      - Acceptable is a subjective concept that enables distinguishing with "unacceptable". By itself
        it does not signal any permission or obligation - for which further specific concepts are defined
    broader:
      - dpv:Rule
    inScheme:
      - dpv:rules-classes
    isDefinedBy:
      - 'dpv:'
    term_status: accepted
    created:
      - '2025-06-19'
    contributor:
      - dpv_agent:person-arthit-suriyawongkul
      - dpv_agent:person-beatriz-esteves
      - dpv_agent:person-delaram-golpayegani
      - dpv_agent:person-georg-p-krog
      - dpv_agent:person-harshvardhan-j-pandit
      - dpv_agent:person-julian-flake
      - dpv_agent:person-paul-ryan
  - id: dpv:AcceptableUsePolicy
    rdf_type:
      - dpv:OrganisationalMeasure
    prefLabel: Acceptable Use Policy
    definition: Acceptable Use Policy (AUP) refers to conditions, contexts, or uses which are considered
      acceptable with the implication that those not covered by such a policy are to be considered unacceptable
    broader:
      - dpv:Policy
    inScheme:
      - dpv:organisational-measures-classes
    isDefinedBy:
      - 'dpv:'
    term_status: accepted
    created:
      - '2025-06-19'
    contributor:
      - dpv_agent:person-arthit-suriyawongkul
      - dpv_agent:person-beatriz-esteves
      - dpv_agent:person-delaram-golpayegani
      - dpv_agent:person-georg-p-krog
      - dpv_agent:person-harshvardhan-j-pandit
      - dpv_agent:person-julian-flake
      - dpv_agent:person-julio-hernandez
      - dpv_agent:person-paul-ryan
  - id: dpv:Access
    rdf_type:
      - dpv:Processing
    prefLabel: Access
    definition: to access data
    broader:
      - dpv:Use
    inScheme:
      - dpv:processing-classes
    isDefinedBy:
      - 'dpv:'
    term_status: accepted
    created:
      - '2022-06-15'
    contributor:
      - dpv_agent:person-georg-p-krog
      - dpv_agent:person-harshvardhan-j-pandit
  - id: dpv:AccessControlMethod
    rdf_type:
      - dpv:TechnicalMeasure
    prefLabel: Access Control Method
    definition: Methods which restrict access to a place or resource
    broader:
      - dpv:TechnicalMeasure
    inScheme:
      - dpv:technical-measures-classes
    isDefinedBy:
      - 'dpv:'
    example:
      - dex:E0020
    term_status: accepted
    created:
      - '2019-04-05'
    contributor:
      - dpv_agent:person-axel-polleres
      - dpv_agent:person-harshvardhan-j-pandit
      - dpv_agent:person-mark-lizar
      - dpv_agent:person-rob-brennan
  - id: dpv:AccountManagement
    rdf_type:
      - dpv:Purpose
    prefLabel: Account Management
    definition: Account Management refers to purposes associated with account management, such as to create,
      provide, maintain, and manage accounts
    broader:
      - dpv:Purpose
    inScheme:
      - dpv:purposes-classes
    isDefinedBy:
      - 'dpv:'
    term_status: accepted
    created:
      - '2021-09-08'
    contributor:
      - dpv_agent:person-beatriz-esteves
      - dpv_agent:person-georg-p-krog
      - dpv_agent:person-harshvardhan-j-pandit
  - id: dpv:Acquire
    rdf_type:
      - dpv:Processing
    prefLabel: Acquire
    definition: to come into possession or control of the data
    broader:
      - dpv:Obtain
    inScheme:
      - dpv:processing-classes
    isDefinedBy:
      - 'dpv:'
    term_status: accepted
    created:
      - '2019-05-07'
    source_page:
      - page_name: GDPR Art.4-2
        url: https://eur-lex.europa.eu/eli/reg/2016/679/art_4/par_2/oj
  - id: dpv:ActiveRight
    rdf_type:
      - dpv:Right
    prefLabel: Active Right
    definition: The right(s) applicable, provided, or expected that need to be (actively) exercised
    scopeNote:
      - Active rights require the entity to expressly exercise them. For example, a Data Subject exercising
        their right to withdraw their consent.
    broader:
      - dpv:Right
    inScheme:
      - dpv:rights-classes
    isDefinedBy:
      - 'dpv:'
    term_status: accepted
    created:
      - '2022-10-22'
    contributor:
      - dpv_agent:person-beatriz-esteves
      - dpv_agent:person-georg-p-krog
      - dpv_agent:person-harshvardhan-j-pandit
      - dpv_agent:person-paul-ryan
  - id: dpv:ActivelyInvolved
    rdf_type:
      - dpv:InvolvementStatus
    prefLabel: Actively Involved
    definition: Status indicating the specified context is 'actively' involved
    scopeNote:
      - An example of active involvement is a person directly using a system to enter information
    broader:
      - dpv:InvolvementStatus
    inScheme:
      - dpv:status-classes
    isDefinedBy:
      - 'dpv:'
    term_status: accepted
    created:
      - '2024-05-10'
    contributor:
      - dpv_agent:person-delaram-golpayegani
      - dpv_agent:person-georg-p-krog
      - dpv_agent:person-harshvardhan-j-pandit
      - dpv_agent:person-paul-ryan
  - id: dpv:ActivityCompleted
    rdf_type:
      - dpv:ActivityStatus
    prefLabel: Activity Completed
    definition: State of an activity that has completed i.e. is fully in the past
    broader:
      - dpv:ActivityStatus
    inScheme:
      - dpv:status-classes
    isDefinedBy:
      - 'dpv:'
    term_status: accepted
    created:
      - '2022-05-18'
    contributor:
      - dpv_agent:person-harshvardhan-j-pandit
  - id: dpv:ActivityHalted
    rdf_type:
      - dpv:ActivityStatus
    prefLabel: Activity Halted
    definition: State of an activity that was occurring in the past, and has been halted or paused or
      stopped
    broader:
      - dpv:ActivityStatus
    inScheme:
      - dpv:status-classes
    isDefinedBy:
      - 'dpv:'
    term_status: accepted
    created:
      - '2022-05-18'
    contributor:
      - dpv_agent:person-harshvardhan-j-pandit
  - id: dpv:ActivityMonitoring
    rdf_type:
      - dpv:TechnicalMeasure
    prefLabel: Activity Monitoring
    definition: Monitoring of activities including assessing whether they have been successfully initiated
      and completed
    broader:
      - dpv:TechnicalMeasure
    inScheme:
      - dpv:technical-measures-classes
    isDefinedBy:
      - 'dpv:'
    term_status: accepted
    created:
      - '2022-08-17'
    contributor:
      - dpv_agent:person-harshvardhan-j-pandit
    source_page:
      - page_name: ENISA Reference Incident Classification Taxonomy 2018
        url: https://www.enisa.europa.eu/publications/reference-incident-classification-taxonomy/
  - id: dpv:ActivityNotCompleted
    rdf_type:
      - dpv:ActivityStatus
    prefLabel: Activity Not Completed
    definition: State of an activity that could not be completed, but has reached some end state
    scopeNote:
      - This relates to a 'Stop' state as distinct from a 'Halt' state. It makes no comments on whether
        the Activity can be resumed or continued towards completion.
    broader:
      - dpv:ActivityStatus
    inScheme:
      - dpv:status-classes
    isDefinedBy:
      - 'dpv:'
    term_status: accepted
    created:
      - '2022-11-30'
    contributor:
      - dpv_agent:person-harshvardhan-j-pandit
  - id: dpv:ActivityOngoing
    rdf_type:
      - dpv:ActivityStatus
    prefLabel: Activity Ongoing
    definition: State of an activity occurring in continuation i.e. currently ongoing
    broader:
      - dpv:ActivityStatus
    inScheme:
      - dpv:status-classes
    isDefinedBy:
      - 'dpv:'
    term_status: accepted
    created:
      - '2022-05-18'
    contributor:
      - dpv_agent:person-harshvardhan-j-pandit
  - id: dpv:ActivityPlanned
    rdf_type:
      - dpv:ActivityStatus
    prefLabel: Activity Planned
    definition: State of an activity being planned with concrete plans for implementation
    broader:
      - dpv:ActivityStatus
    inScheme:
      - dpv:status-classes
    isDefinedBy:
      - 'dpv:'
    term_status: accepted
    created:
      - '2024-05-19'
    contributor:
      - dpv_agent:person-harshvardhan-j-pandit
  - id: dpv:ActivityProposed
    rdf_type:
      - dpv:ActivityStatus
    prefLabel: Activity Proposed
    definition: State of an activity being proposed without any concrete plans for implementation
    broader:
      - dpv:ActivityStatus
    inScheme:
      - dpv:status-classes
    isDefinedBy:
      - 'dpv:'
    term_status: accepted
    created:
      - '2022-05-18'
    modified: '2024-05-19'
    contributor:
      - dpv_agent:person-harshvardhan-j-pandit
  - id: dpv:ActivityStatus
    prefLabel: Activity Status
    definition: Status associated with activity operations and lifecycles
    broader:
      - dpv:Status
    inScheme:
      - dpv:status-classes
    isDefinedBy:
      - 'dpv:'
    subClassOf:
      - dpv:Status
    example:
      - dex:E0054
    term_status: accepted
    created:
      - '2022-05-18'
    contributor:
      - dpv_agent:person-harshvardhan-j-pandit
  - id: dpv:Adapt
    rdf_type:
      - dpv:Processing
    prefLabel: Adapt
    definition: to modify the data, often rewritten into a new form for a new use
    broader:
      - dpv:Transform
    inScheme:
      - dpv:processing-classes
    isDefinedBy:
      - 'dpv:'
    term_status: accepted
    created:
      - '2019-05-07'
    source_page:
      - page_name: GDPR Art.4-2
        url: https://eur-lex.europa.eu/eli/reg/2016/679/art_4/par_2/oj
  - id: dpv:Adult
    rdf_type:
      - dpv:HumanSubject
    prefLabel: Adult
    definition: A natural person that is not a child i.e. has attained some legally specified age of adulthood
    broader:
      - dpv:HumanSubject
    inScheme:
      - dpv:entities-datasubject-classes
    isDefinedBy:
      - 'dpv:'
    term_status: modified
    created:
      - '2022-03-30'
    modified: '2024-12-17'
    contributor:
      - dpv_agent:person-georg-p-krog
  - id: dpv:Advertising
    rdf_type:
      - dpv:Purpose
    prefLabel: Advertising
    definition: Purposes associated with conducting advertising i.e. process or artefact used to call
      attention to a product, service, etc. through announcements, notices, or other forms of communication
    scopeNote:
      - Advertising is a subset of Marketing. Advertising by itself does not indicate 'personalisation'
        i.e. personalised ads.
    broader:
      - dpv:Marketing
    inScheme:
      - dpv:purposes-classes
    isDefinedBy:
      - 'dpv:'
    term_status: accepted
    created:
      - '2020-11-04'
    contributor:
      - dpv_agent:person-beatriz-esteves
      - dpv_agent:person-georg-p-krog
      - dpv_agent:person-harshvardhan-j-pandit
  - id: dpv:AgeVerification
    rdf_type:
      - dpv:Purpose
    prefLabel: Age Verification
    definition: Purposes associated with verifying or authenticating age or age related information as
      a form of security
    scopeNote:
      - Age Verification can include verification of the exact age, e.g. being 21 years old, a date, e.g.
        birth date is 01 January 1969, or a condition, e.g. age is over 21 years and the person is an
        adult. Specific dedicated resources should be used to further express information and processes
        associated with Age Verification, for example the Age Verification Vocabulary https://w3id.org/age/
    broader:
      - dpv:Verification
    inScheme:
      - dpv:purposes-classes
    isDefinedBy:
      - 'dpv:'
    term_status: accepted
    created:
      - '2024-02-14'
    contributor:
      - dpv_agent:person-arthit-suriyawongkul
      - dpv_agent:person-beatriz-esteves
      - dpv_agent:person-harshvardhan-j-pandit
  - id: dpv:Agent
    prefLabel: Agent
    definition: An Agent is a dpv:Entity that is (a) acting on behalf of another Entity; and (b) is authorised
      to do so by that Entity
    scopeNote:
      - the Entity the Agent is acting on behalf of can be a human or non-human and a legal or non-legal
        entity. For specific distinction, see dpv:LegalAgent and tech:MachineAgent. The form and validity
        of authorisation through which the Agent is empowered to represent and act on behalf of the Entity
        is not defined or covered in this concept
    broader:
      - dpv:Entity
    inScheme:
      - dpv:entities-classes
    isDefinedBy:
      - 'dpv:'
    subClassOf:
      - dpv:Entity
    term_status: accepted
    created:
      - '2025-10-28'
    contributor:
      - dpv_agent:person-harshvardhan-j-pandit
  - id: dpv:Aggregate
    rdf_type:
      - dpv:Processing
    prefLabel: Aggregate
    definition: to aggregate data
    broader:
      - dpv:Alter
    related:
      - svpr:Aggregate
    inScheme:
      - dpv:processing-classes
    isDefinedBy:
      - 'dpv:'
    term_status: accepted
    created:
      - '2024-04-14'
    contributor:
      - dpv_agent:person-beatriz-esteves
      - dpv_agent:person-harshvardhan-j-pandit
    source_page:
      - page_name: SPECIAL Project
        url: https://specialprivacy.ercim.eu/vocabs/processing
  - id: dpv:AlgorithmicLogic
    prefLabel: Algorithmic Logic
    definition: The algorithmic logic applied or used
