  - id: dpv:hasStatus
    prefLabel: has status
    definition: Indicates the status of specified concept
    scopeNote:
      - Also used to Indicate the status of a Right Exercise Activity
      - For expressing the status of the DPIA document or process. Here different statuses are used to
        convey different contextual meanings. For example, dpv:ActivityStatus expresses the state of the
        activity in terms of whether it is ongoing or completed, and dpv:AuditStatus expresses the state
        of the audit process in terms of being required, approved, or rejected. These are applied over
        each step of the DPIA i.e. DPIANecessityAssessment, DPIAProcedure, and DPIAOutcome. Similarly,
        a process also uses hasStatus with DPIAConformity to indicate adherence to the results of the
        DPIA process.
    inScheme:
      - dpv:rights-properties
      - dpv:status-properties
      - eu-gdpr:dpia-properties
