    prefLabel: Right Fulfilment Notice
    definition: Notice provided regarding fulfilment of a right
    scopeNote:
      - This notice is associated with situations where information is provided with the intention of
        progressing the fulfilment of a right. For example, a notice asking for more information regarding
        the scope of the right, or providing information on where to access the data provided under a
        right.
