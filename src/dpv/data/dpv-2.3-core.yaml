  - id: dpv:ExpressedConsent
    rdf_type:
      - dpv:LegalBasis
    prefLabel: Expressed Consent
    definition: Consent that is expressed through an action intended to convey a consenting decision
    scopeNote:
      - Expressed consent requires the individual take a specific and unambiguous action that directly
        indicates their consent. This action may be a part of other processes such as setting preferences,
        or agreeing to a contract, or other matters not relating to consent. An example of expressed consent
        is interacting with a checkbox within a dashboard or clicking a button on a web form
    broader:
      - dpv:InformedConsent
    inScheme:
      - dpv:consent-types-classes
    isDefinedBy:
