  - id: dpv:ExpectationStatus
    prefLabel: Expectation Status
    definition: Status indicating whether the specified context was intended or unintended
    scopeNote:
      - Expectation is associated with the outcome of a goal or purpose for what is expected to happen
        i.e. an ex-post indication of what was expected to happen in the specified context. Intention
        and Expectation are closely related terms. We recommend using Intention when the entity has the
        ability to control the implementation and Expectation for when the entity does not have control
        or for what happens after or beyond the exercise of control.
    inScheme:
      - dpv:status-classes
