  - id: dpv:Right
    prefLabel: Right
    definition: The right(s) applicable, provided, or expected
    scopeNote:
      - A 'right' is a legal, social, or ethical principle of freedom or entitlement which dictate the
        norms regarding what is allowed or owed. Rights as a concept encompass a broad area of norms and
        entities, and are not specific to Individuals or Data Protection / Privacy. For individual specific
        rights, see dpv:DataSubjectRight
    inScheme:
      - dpv:rights-classes
    isDefinedBy:
