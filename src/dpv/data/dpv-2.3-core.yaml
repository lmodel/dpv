  - id: dpv:Tracking
    rdf_type:
      - dpv:Processing
    prefLabel: Tracking
    definition: to use data to track a specific factor (e.g. a human or their activities) across multiple
      distinct contexts
    scopeNote:
      - Tracking is a widely used (and abused) concept and therefore carries several distinct interpretations,
        for example see Do Not Track which defines tracking in the context of the web, and where other
        forms of tracking such as location tracking or physical biometric tracking may exist which are
        defined differently. For this concept, DPVCG defines Tracking in the broadest possible sense and
        strongly recommends adopters to provide their specific definition or interpretation by either
        extending this concept, through a usage note, or by contributing the specific term back to DPVCG
        for inclusion in DPV or an extension. This concept may change in the future based on developments
        in privacy and legal spaces. In DPV, Tracking is defined as a type of processing operation that
        may collect and/or may use data - which covers both initial collection and usage as well as subsequent
        use of existing data to track an individual. The classification of Tracking as a processing operation
        also implies that it is not sufficient as a Purpose on its own and therefore a suitable purpose
        from the DPV taxonomy should be used to justify it.
    broader:
      - dpv:Use
    inScheme:
      - dpv:processing-classes
    isDefinedBy:
      - 'dpv:'
    example:
      - dex:E0075
    term_status: accepted
    created:
      - '2024-12-17'
    contributor:
      - dpv_agent:person-beatriz-esteves
      - dpv_agent:person-harshvardhan-j-pandit
      - dpv_agent:person-iain-henderson
