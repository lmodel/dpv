  - id: dex:E0085
    title: Role of dpv:Processing and using it in dpv:Process
    description: |-
      <p>This example shows the myriad ways that processing could be used to describe other non-processing operation information such as personal data and entity involved. To accurately represent the information in a consistent and reusable manner, we recommend using dpv:Process as the way to combine concepts in to a 'unit' and to reuse this in other processes. This means dpv:Processing only specifies information about the processing operation involved, and optionally the technology being used if it is relevant to the context.</p>
      <p>In Method 1, the processing instance contains personal data and entity involved - this is not recommended as the instance now contains information not related to the processing operation itself. Method 2 shows a processing instance which is implemented using a specific technology. This is acceptable as it describes the processing operation in terms of involved technology, and can be a way to reuse the processing operation in other processes while someone (e.g. IT department) can change the underlying technology. Method 3 represents the best practice of using dpv:Process to describe all concepts in a modular and granular manner with a separation of concerns. Processes can include other processes - so we can describe processing and technology and data involved as a process and involve it in other processes. This makes the task of finding information easier as we only have to look for composition of processes, instead of investigating each purpose or processing or another concept involved for what data or technology it involves.</p>
    format:
      - text/turtle
    source:
      - E0085.ttl
    subject:
      - dpv:Processing
      - dpv:hasProcessing
      - dpv:isImplementedByEntity
      - dpv:isImplementedUsingTechnology
    created:
      - '2025-01-01'
    contributor:
      - dpv_agent:person-harshvardhan-j-pandit
    term_status: accepted
    resources:
      - id: ex:AnotherProcess
        hasProcess:
          - ex:SomeOtherProcess
          - ex:SomeProcess
        rdf_type:
          - dpv:Process
      - id: ex:SomeProcess
        hasPersonalData:
          - dpv:Location
          - pd:Location
        hasProcessing:
          - ex:SomeProcessing
        isImplementedByEntity:
          - ex:AcmeInc
        isImplementedUsingTechnology:
          - ex:SomeMethod
        rdf_type:
          - dpv:Process
      - id: ex:SomeProcessing
        broader:
          - dpv:Collect
          - dpv:Store
        hasPersonalData:
          - dpv:Location
        isImplementedByEntity:
          - ex:AcmeInc
        isImplementedUsingTechnology:
          - ex:SomeMethod
        rdf_type:
          - dpv:Processing
  - id: dex:E0086
    title: Using Risk Controls to indicate measures adopted for a specific event
    description: |-
      <p>This example shows how risk controls can be used to represent the specific measures in place to detect, monitor, address, and inform stakeholders regarding risks, consequences, and impacts. The first part shows a risk with its associated consequence and resulting impact. The second part shows the process where this risk is present, and the specific controls put in place to: (1) monitor the process for vulnerabilities and avoid the source of risk with oversight,; (2) avoid the consequence event; and (3) monitor for occurrence of the impact event, and if it occurs to halt it and to inform the affected person.</p>
      <p>In this example the specific details of the control such as the technology being used, or what characteristics are changed when avoiding an event are not specified to reduce the length of content. To express this information, the specific control can reference two events as Risk and Residual Risk respectively - one which shows the initial values such as likelihood, and another one which shows the modified values. Currently the DPVCG does not dictate a specific method for expressing such information, and welcomes suggestions on best practices for the same.</p>
    format:
      - text/turtle
    source:
      - E0086.ttl
    subject:
      - risk:RiskControl
      - risk:controls
    created:
      - '2025-01-12'
    contributor:
