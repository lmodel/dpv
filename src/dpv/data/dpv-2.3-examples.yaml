  - id: dex:E0023
    title: Consent record example
    description: <p>This (simplified) example shows a consent record containing the topic of consent (i.e.
      which processing activities it was about), its current status, and when it was given by the data
      subject. The structure of a record is highly dependent on the requirements of the use-case, and
      can vary across implementations. In this case, it is based on the ISO/IEC TS 27560:2023 Privacy
      technologies — Consent record information structure, for which we provide the implementation guide
      [[[GUIDE-Consent-27560]]].</p><p>The example uses the <a href="https://dublincore.org/specifications/dublin-core/dcmi-terms/">DCMI
      Metadata Terms (dct)</a> vocabulary to indicate metadata such as title and timestamps. Other vocabularies
      such as <a href="https://www.w3.org/TR/prov-o/">PROV-O</a> can be used to also indicate provenance
      information such as when it was generated and how it was produced.</p>
    format:
      - text/turtle
    source:
      - E0023.ttl
    subject:
      - dpv:ConsentRecord
    created:
      - '2024-06-10'
    contributor:
      - dpv_agent:person-harshvardhan-j-pandit
    term_status: accepted
    resources:
      - id: _:E0023-1
        hasDataController:
          - ex:Acme
        hasJurisdiction:
          - loc:EU
        hasLegalBasis:
          - dpv:Consent
        hasPersonalData:
          - pd:EmailAddressPersonal
        hasProcessing:
          - dpv:Collect
          - dpv:Store
        hasPurpose:
          - dpv:Marketing
        hasRecipient:
          - ex:Beta
          - ex:Epsilon
        hasStorageCondition:
          - _:E0023-2
        rdf_type:
