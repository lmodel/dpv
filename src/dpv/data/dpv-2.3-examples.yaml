  - id: dex:E0075
    title: Expressing involvement of tracking and profiling in processing
    description: |-
      <p>This example shows how the involvement of tracking and profiling can be expressed within a process. The first method simply states that tracking and profiling occur - this should be considered as bad practice as it does not clarify what the tracking and profiling involves in terms of data and entities - in particular what is being inferred as part of the profiling of data subjects. The second method is a verbose representation showing tracking is a composite process consisting of collecting and using location to generate a 'location tracking data' for the individual, which is then used in the profiling process to infer financial status of the individual.</p>
      <p>Through the explicit details of data involved in tracking and profiling, the transparency and accountability principles are easier to satisfy, and we can additionally perform appropriate risk/impact assessments to analyse whether the tracking and profiling should be allowed or not. The verbosity also shows that tracking and profiling are two separate processes - which is essential when the same tracking or profiling occurs in more than one process. The last part shows how this verbosity can be reduced by taking the tracking and profiling (which as mentioned earlier are likely to be common to several processes) and assigning them a unique IRI or identifier, and using to indicate their involvement in a process.</p>
    format:
      - text/turtle
    source:
      - E0075.ttl
    subject:
      - dpv:Profiling
      - dpv:Tracking
    created:
      - '2024-12-17'
    contributor:
      - dpv_agent:person-harshvardhan-j-pandit
    term_status: accepted
    resources:
      - id: _:E0075-1
        broader:
          - dpv:Collect
          - dpv:Use
        hasPersonalData:
          - pd:Location
        rdf_type:
          - dpv:Processing
      - id: _:E0075-2
        broader:
          - dpv:Generate
          - dpv:Store
        hasPersonalData:
          - ex:LocationTrackingData
        rdf_type:
          - dpv:Processing
      - id: _:E0075-3
        broader:
          - dpv:Tracking
        hasProcessing:
          - _:E0075-1
          - _:E0075-2
        rdf_type:
          - dpv:Process
          - dpv:Processing
      - id: _:E0075-4
        broader:
          - dpv:Profiling
        hasProcessing:
          - _:E0075-5
          - _:E0075-6
        rdf_type:
          - dpv:Process
          - dpv:Processing
      - id: _:E0075-5
        broader:
          - dpv:Infer
          - dpv:Store
        hasPersonalData:
          - pd:FinancialStatus
        rdf_type:
          - dpv:hasProcessing
      - id: _:E0075-6
        broader:
          - dpv:Use
        hasPersonalData:
          - ex:LocationTrackingData
        rdf_type:
          - dpv:hasProcessing
      - id: ex:Service
