  - id: dex:E0006
    title: Nesting Processes
    description: <p>Consider the example where <em>Acme</em>, as a <em>DataController</em>, maintains
      records of its processing activities using <code>Process</code> to represent one of its services.
      In this, it collects email, uses it for internal analyses based on <em>Legitimate Interests</em>,
      and also sends marketing information by using a processor based on the data subject's consent. Using
      nesting of processes, the information can be expressed at a granular level representing service,
      individual purposes, and so on.</p>
    format:
      - text/turtle
    source:
      - E0006.ttl
    subject:
      - dpv:Process
