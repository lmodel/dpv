    description: This example shows a process where email address is required to be collected, and name
      can be optionally collected. Note that the necessity applies to the entire process i.e. both personal
      data and the collect processing operation. It also provides an indication of the importance of the
      process - for example to indicate which processes are important for the organisation (primary importance)
      and which are not as important or are not crucial (secondary importance).
