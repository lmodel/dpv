          - dpv:ExplicitlyExpressedConsent
        statements:
          - predicate: dpv:hasDuration
            literal: '63115200'
            datatype: xsd:integer
          - predicate: dpv:hasEntity
            literal: 96121fde-199f-4848-8942-4436e270513a
          - predicate: dpv:isIndicatedAtTime
            literal: '2021-05-28T12:24:00'
