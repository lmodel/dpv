  - id: dex:E0027
    title: Indicating risks, consequences, and impacts
    description: <p>In this example, we consider <i>Risk</i> can be associated with any concept given
      its broad existence and applicability, and that its mitigation is a technical and organisational
      measure. Using this, the implemented or adopted technical and organisational measures within an
      use-case are annotated with the risks they address or mitigate, along with specific impacts that
      may occur if the risk were to occur. For example, the storage of personal data within a database
      has an implementation of access control that mitigates the consequence of unauthorised access and
      its impact to cause harm.</p>
    format:
      - text/turtle
    source:
      - E0027.ttl
    subject:
      - dpv:Consequence
      - dpv:Impact
      - dpv:Risk
    created:
      - '2024-06-10'
    contributor:
      - dpv_agent:person-harshvardhan-j-pandit
    term_status: accepted
