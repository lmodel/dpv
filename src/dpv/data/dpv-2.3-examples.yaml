    description: This example shows the use of risk concepts in DPV and RISK extension to represent a
      risk of data breach associated with a process along with its potential consequences and impacts
      on the data subject. The scenario consists of a risk of data breach with high likelihood and severity,
      and whose potential consequence includes a loss of data which can lead to financial loss for the
      data controller and misuse of breached information to cause identity fraud for the data subject.
