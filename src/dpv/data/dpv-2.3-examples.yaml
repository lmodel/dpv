    title: Process used to combine core concepts and represent an use-case
    description: <p>An example of how <code>Process</code> brings together the core concepts, consider
      the example where <code>Acme</code> is a <code>DataController</code> that <code>Collect</code>(s)
      and <code>Use</code>(s) <code>Email</code> for <code>ServiceProvision</code>. Note that the <code>pd:EmailAddress</code>
      is a concept from the [[[PD]]] extension.</p>
    format:
