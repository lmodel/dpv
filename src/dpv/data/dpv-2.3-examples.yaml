        hasTechnicalMeasure:
          - ex:RBACCredential
        rdf_type:
          - dpv:Technology
      - id: ex:RBACCredential
        broader:
          - dpv:AccessControlMethod
        mitigatesRisk:
          - ex:UnAuthorisedAccess
        rdf_type:
          - dpv:RiskMitigationMeasure
          - dpv:TechnicalMeasure
      - id: ex:SecurityPolicy
        broader:
          - dpv:Policy
        hasOrganisationalMeasure:
          - dpv:StaffTraining
        mitigatesRisk:
          - ex:UnAuthorisedAccess
        rdf_type:
          - dpv:OrganisationalMeasure
      - id: ex:UnAuthorisedAccess
        hasConsequence:
          - risk:UnauthorisedDataAccess
        hasImpact:
          - risk:Harm
        isMitigatedByMeasure:
          - ex:RBACCredential
        rdf_type:
          - dpv:Risk
