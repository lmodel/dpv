  - id: dex:E0044
    title: Specifying personal data
    description: 'This example shows how personal data can be specified by for a work email address in
      four methods: (1) by using the PD taxonomy, (2) extending a concept from PD taxonomy,(3) specifying
      the exact value of email address, and (4) using external vocabularies such as schema.org. In all
      of these, it is strongly recommended to include a DPV concept (i.e. declare it as Personal Data)
      for interoperability, and to align it with the DPV and PD taxonomies where relevant (e.g. to mention
      it is an email address, or to specify it is identifier, or that it is sensitive - which it is not
      in this case)'
