  - id: dex:E0087
    title: Flexibility of RISK taxonomy in expressing varying roles
    description: |-
      <p>This example shows how the same concept <code>risk:DataBreach</code> can take on different roles across contexts. The first part shows data breach as a consequence of a malware attack, while the second part shows it as a risk source which could lead to identity fraud and misuse. In these, the same concept of data breach being a consequence or a risk source is context-dependant. The RISK extension does not specify or assert that a data breach is always a risk source or risk or consequence - only that it has the potential to be these things. Therefore, inclusion of RISK extension in the graph does not 'pollute' it or cause misinterpretations such as data breach showing up as a consequence even though it has been asserted to (only) be a risk source.</p>
      <p>The third part shows how these different roles are associated with the concept, and how this can be used in UI/UX to provide users with a list of options for selecting risks. It also shows the distinction between marking or annotating a concept to include it in risk identification process (<code>risk:PotentialRisk</code>) and asserting that the concept is applicable as a risk in a process (<code>dpv:hasRisk</code>). This allows use-cases to directly use the RISK extension's subjective classification of concepts in UI/UX - such as to populate the dropdown of risks, and also provides flexibility to ignore that and create their own thesauri or categorisations by using the <code>risk:PotentialRisk</code> concept to annotate concepts, or to create specific subclasses for contextual classifications.</p>
    format:
      - text/turtle
    source:
      - E0087.ttl
    subject:
      - risk:PotentialConsequence
      - risk:PotentialImpact
      - risk:PotentialRisk
      - risk:PotentialRiskSource
    created:
      - '2025-01-12'
    contributor:
      - dpv_agent:person-harshvardhan-j-pandit
    term_status: accepted
    resources:
      - id: ex:ProcessA
        hasConsequence:
          - risk:DataBreach
        hasRisk:
          - risk:UnauthorisedDataAccess
        hasRiskSource:
          - risk:MalwareAttack
        rdf_type:
          - dpv:Process
      - id: ex:ProcessB
        hasConsequence:
          - risk:IntentionalMisuse
        hasImpact:
          - risk:RightsImpact
        hasRisk:
          - risk:IdentityFraud
        hasRiskSource:
          - risk:DataBreach
        rdf_type:
          - dpv:Process
      - id: ex:SomeProcess
        hasRisk:
          - risk:DataBreach
        rdf_type:
          - dpv:Process
      - id: risk:DataBreach
        rdf_type:
          - risk:PotentialConsequence
          - risk:PotentialRisk
