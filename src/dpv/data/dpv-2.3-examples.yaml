  - id: dex:E0010
    title: Indicating personal data is sensitive or special category
    description: |-
      <p>In a medical study involving genetic data, the person's collected blood samples are considered to be 'special category' personal data under the GDPR. In addition to this, the person's identifier associated with that dataset to enable monitoring future appointments is considered sensitive within the medical centre. Note that the examples use the [[PD]] extension to represent some concepts.</p>
      <p>In this example, the knowledge that blood samples are of type 'special category' can be inferred from the fact that they are a form of <i>Medical Health</i> which is a 'special category'. However, the example considers best practices that suggest explicitly identifying and denoting that blood samples are also of type 'special category'.</p>
    format:
      - text/turtle
    source:
      - E0010.ttl
    subject:
      - dpv:SensitivePersonalData
      - dpv:SpecialCategoryPersonalData
    created:
      - '2024-06-10'
    contributor:
      - dpv_agent:person-harshvardhan-j-pandit
    term_status: accepted
    resources:
      - id: ex:BloodSamples
        broader:
          - pd:MedicalHealth
        rdf_type:
          - dpv:SpecialCategoryPersonalData
        statements:
          - predicate: skos:narrower
            reference: pd:BloodType
      - id: ex:PatientIdentifier
        broader:
          - pd:Identifying
        rdf_type:
          - dpv:SensitivePersonalData
      - id: ex:PatientStudy
        hasPersonalData:
          - ex:BloodSamples
          - ex:PatientIdentifier
        rdf_type:
          - dpv:Process
  - id: dex:E0011
    title: Indicating Storage Conditions
    description: <p>This example includes Acme as a Data Processor that stores data within servers located
      in Ireland for a period of one year. The temporal information is represented using [[[TIME]]], and
      the location is specified using [[[LOC]]].</p><p>In this example, the <code>StorageCondition</code>
      is expressed as a separate policy applicable. It is also possible to directly express it over other
      concepts such as a service, technology, or a processing operation, e.g. to say <code>ex:AcmeStore
      dpv:hasStorageCondition ...</code>.</p>
    format:
      - text/turtle
    source:
      - E0011.ttl
    subject:
      - dpv:StorageCondition
    created:
      - '2024-06-10'
    contributor:
      - dpv_agent:person-harshvardhan-j-pandit
    term_status: accepted
    resources:
      - id: _:E0011-1
        rdf_type:
          - dpv:Duration
          - time:Duration
        statements:
          - predicate: time:numericDuration
            literal: '1'
            datatype: xsd:decimal
          - predicate: time:unitType
            reference: time:unitYear
      - id: ex:DataStoragePolicy
        hasDuration:
          - _:E0011-1
        hasLocation:
          - loc:IE
        rdf_type:
          - dpv:StorageCondition
      - id: ex:ServerInfo
        hasDataProcessor:
          - ex:Acme
        hasProcessing:
          - dpv:Store
        hasStorageCondition:
          - ex:DataStoragePolicy
        rdf_type:
          - dpv:Process
  - id: dex:E0012
    title: Indicating Data Sources
    description: |-
      <p>Data sources can be the data subject (direct or indirect), the data controller or processor (itself), or another entity (third party). The below example provides an overview of these with distinctions between source and method of generation.</p>
      <p>In this example, <code>ex:S01</code> represents direct collection of data from the data subject, while <code>ex:S02</code> represents indirect collection where data is derived or observed - or undergoes any operation that still points to the data subject as the source. <code>ex:S03</code> infers data, which means the inferring entity (the Controller in this case) is the source of this data - even if the inferred data is based on data collected from the Data Subject. <code>ex:S04</code> has data sourced from another entity - such as a Third Party, but could also refer to a Data Processor. <code>ex:S05</code> represents collection of data from a public dataset that has been published by the data subject themselves.</p>
      <p>Note that the above example is illustrative - it may be pertinent to provide documentation about each data source to ensure sufficient information is recorded for intended purposes. For example, the method of collection (e.g. forms), or inference (e.g. algorithm), or public dataset (e.g. link, license).</p>
    format:
      - text/turtle
    source:
      - E0012.ttl
    subject:
      - dpv:DataSource
    created:
      - '2024-06-10'
    contributor:
      - dpv_agent:person-harshvardhan-j-pandit
    term_status: accepted
    resources:
      - id: ex:Acme
        rdf_type:
          - dpv:ThirdParty
      - id: ex:S01
        hasDataSource:
          - dpv:DataSubject
        hasProcessing:
          - dpv:Collect
      - id: ex:S02
        hasDataSource:
          - dpv:DataSubject
        hasProcessing:
          - dpv:Derive
          - dpv:Observe
      - id: ex:S03
        hasDataSource:
          - dpv:DataController
        hasProcessing:
          - dpv:Infer
      - id: ex:S04
        hasDataSource:
          - ex:Acme
      - id: ex:S05
        hasDataSource:
          - dpv:DataPublishedByDataSubject
        hasProcessing:
          - dpv:Collect
  - id: dex:E0013
    title: Spam filter as Automated Decision Making with Human Involvement
    description: |-
      <p>Consider the use of a spam filter that is based on automated processing operations where humans provide inputs, have oversight of the operation, and results in automated decision making for whether communications should be propagated. A new separate filter is developed that utilises a novel spam detection criteria that also takes into account communications other than emails for the sender and makes automated decisions whether to permit communication to proceed. Such explicit annotation of several high-risk operations assists in performing impact assessments for this technology, as well as understanding the extent and effectiveness of human involvement to mitigate risks and issues.</p>
      <p>In this example, the Spam Filter process allows the users to reverse the effects (i.e. emails marked as spam) but does not allow opting out from the process (i.e. stop spam filtering). The spam detection algorithm performs automated decision making (by deciding which emails to accept), systemic monitoring (of communications), and evaluation and scoring (by scoring contents of emails and senders/recipients). The spam detection algorithm also indicates what human involvement is expected - to provide input (e.g. mark emails as spam) and intervention (e.g. change spam criteria).</p>
    format:
      - text/turtle
    source:
      - E0013.ttl
    subject:
      - dpv:AutomationLevel
      - dpv:HumanInvolvement
    created:
      - '2024-06-10'
    contributor:
      - dpv_agent:person-harshvardhan-j-pandit
    term_status: accepted
    resources:
      - id: _:E0013-1
        isImplementedByEntity:
          - dpv:User
        rdf_type:
          - dpv:CannotOptOutFromProcess
          - dpv:EntityInvolvement
          - dpv:ReversingProcessEffects
      - id: ex:SpamDetection
        broader:
          - dpv:InnovativeUseOfNewTechnologies
        hasContext:
          - dpv:AutomatedDecisionMaking
          - dpv:EvaluationScoring
          - dpv:SystematicMonitoring
        hasDataSource:
          - ex:EmailSender
        hasHumanInvolvement:
          - dpv:HumanInvolvementForInput
          - dpv:HumanInvolvementForIntervention
        hasPersonalData:
          - pd:Communication
        rdf_type:
          - dpv:AlgorithmicLogic
      - id: ex:SpamFilter
        hasAlgorithmicLogic:
          - ex:SpamDetection
        hasAutomationLevel:
          - dpv:FullAutomation
        hasEntityInvolvement:
          - _:E0013-1
        hasProcessing:
          - dpv:Analyse
        rdf_type:
          - dpv:Process
  - id: dex:E0014
    title: Denoting Legal Basis within a Process
    description: '<p>The <code>LegalBasis</code> can be associated with any concept using the relation
      <code>hasLegalBasis</code>. Such associations are of three types: (1) where the legal basis refers
      to an instance, such as the consent or contract associated with a particular data subject; (2) where
      the legal basis refers to the category that will be used to justify processing, such as the concept
      <i>consent</i> to denote consent will be the basis for indicated processing; and lastly (3) where
      the legal basis is defined with a context, such as <i>consent of service consumers</i>.</p>'
    format:
      - text/turtle
    source:
      - E0014.ttl
    subject:
      - dpv:LegalBasis
    created:
      - '2024-06-10'
    contributor:
      - dpv_agent:person-harshvardhan-j-pandit
    term_status: accepted
    resources:
      - id: ex:ConsentUserN00145667
        hasDataSubject:
          - ex:UserN00145667
        rdf_type:
          - dpv:Consent
          - dpv:LegalBasis
      - id: ex:PDH1
        hasDataController:
          - ex:Acme
        hasDataSubject:
          - ex:ServiceConsumers
        hasLegalBasis:
          - dpv:Consent
          - ex:ConsentUserN00145667
          - ex:UserConsent
        rdf_type:
          - dpv:Process
      - id: ex:UserConsent
        broader:
