    description: <p>To indicate staff are trained in the use of credentials, and that a policy exists
      regarding this, the use of <code>OrganisationalMeasure</code> concepts can be combined in several
      ways. Note that the interpretations for how staff training is associated with credentials, or contains
      training regarding credentials is arbitrary in notation. It is intended to demonstrate how different
      perspectives can be represented so as to be suitable to the organisation's documentation practices.</p>
