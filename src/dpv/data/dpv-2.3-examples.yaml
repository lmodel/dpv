          - pd:EmailAddress
        statements:
          - predicate: rdf:value
            literal: work@example.com
      - id: _:E0044-2
        broader:
          - pd:EmailAddress
        rdf_type:
          - dpv:PersonalData
        statements:
          - predicate: skos:prefLabel
            literal: Work Email
            language: en
      - id: _:E0044-3
        broader:
          - pd:EmailAddress
          - pd:Identifier
        rdf_type:
          - dpv:PersonalData
      - id: _:E0044-4
        rdf_type:
          - dpv:PersonalData
          - pd:EmailAddress
          - sdo:ContactPoint
        statements:
          - predicate: sdo:email
            literal: work@example.com
      - id: _:E0044-5
        rdf_type:
          - dpv:PersonalData
          - pd:EmailAddress
          - pd:Identifier
        statements:
          - predicate: rdf:value
            literal: work@example.com
      - id: ex:PDH
        hasPersonalData:
          - _:E0044-1
          - _:E0044-2
          - _:E0044-3
          - _:E0044-4
          - _:E0044-5
          - pd:EmailAddress
