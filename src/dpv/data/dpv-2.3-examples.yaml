  - id: dex:E0020
    title: 'Using technical measure: Protecting data using encryption and access control'
    description: <p>To indicate data is encrypted using the <a href="https://en.wikipedia.org/wiki/RSA_(cryptosystem)">Rivest-Shamir-Adleman
      (RSA) method</a>, one would extend the <a href="https://w3id.org/dpv#Encryption"><code>Encryption</code></a>
      concept within DPV to represent <code>RSA</code>, and then instantiate it with the specific implementation
      used (e.g. to indicate key size). Access to this data is further restricted by requiring a password
      or credential.</p>
    format:
      - text/turtle
    source:
      - E0020.ttl
    subject:
      - dpv:AccessControlMethod
      - dpv:Encryption
      - dpv:TechnicalMeasure
    created:
      - '2024-06-10'
    contributor:
      - dpv_agent:person-harshvardhan-j-pandit
    term_status: accepted
    resources:
      - id: ex:RBACCredential
        broader:
          - dpv:AccessControlMethod
        rdf_type:
          - dpv:TechnicalMeasure
        statements:
          - predicate: skos:definition
            literal: An access control mechanism around roles and privileges
            language: en
          - predicate: skos:prefLabel
            literal: Role-Based Access Control
            language: en
      - id: ex:RSAEncryption
        broader:
          - dpv:Encryption
        rdf_type:
          - dpv:TechnicalMeasure
        statements:
          - predicate: skos:scopeNote
            literal: 'Key size: 2048, Custom Implementation'
            language: en
  - id: dex:E0021
