  - id: dex:E0076
    title: Representing contract metadata and controls
    description: The below example shows using [[DCT]] and DPV properties to represent metadata about
      contracts. [[DCT]] is used for generic properties such as titles and descriptions, as well as contract-specific
      properties such as when it was accepted by all parties and the provenance of the contract document.
      The DPV properties are useful to express properties such as entities involved in specific roles
      such as Service Provider or a Data Controller, and to denote the type of contract which is useful
      for its interpretation - such as whether it is a negotiated or a standard form (non-negotiated)
      contract.
