    source:
      - '[[GDNG]] § 6(3)'
  - id: de-gdng:DeletionPolicy
    prefLabel: DeletionPolicy
    prefLabel_de: Lösch-Richtlinie
    definition: Personal data processed pursuant to the legal basis of of § 6(1) GDNG must be deleted
      30 years of the beginn of processing
    definition_de: Nach der Rechtsgrundlage § 6(1) weitervarbeitete personenbezogene Daten müssen spätestens
      30 Jahre nach Beginn der Weiterverarbeitung gelöscht werden
    inScheme:
      - de-gdng:lawfulness-classes
    isDefinedBy:
      - 'de-gdng:'
    term_status: accepted
    created:
      - '2025-10-13'
    contributor:
