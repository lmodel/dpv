      the following characteristics: (a) they are established for the specific purpose of meeting needs
      in the general interest, and do not have an industrial or commercial character; (b) they have legal
      personality; (c) they are financed, for the most part, by the State, regional or local authorities,
      or other bodies governed by public law, are subject to management supervision by those authorities
      or bodies, or have an administrative, managerial or supervisory board, more than half of whose members
