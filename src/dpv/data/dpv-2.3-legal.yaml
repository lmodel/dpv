    prefLabel: Binding Corporate Rules (BCR)
    definition: ‘Binding Corporate Rules’ means personal data protection policies which are adhered to
      by a controller or processor established on the territory of a Member State for transfers or a set
      of transfers of personal data to a controller or processor in one or more third countries within
      a group of undertakings, or group of enterprises engaged in a joint economic activity
    scopeNote:
