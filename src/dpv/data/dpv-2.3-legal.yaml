concepts:
  - id: de-gdng:Anonymization
    prefLabel: Anonymization of Data
    prefLabel_de: Anonymisierung von Gesundheitsdaten
    definition: Personal data processed under § 6(1) GDNG has to be anonymized, if allowed by the therein
      defined pruposes
    definition_de: Nach der Rechtsgrundlage § 6(1) GDNG weitervarbeitete personenbezogene Daten müssen
      anonymisiert  werden, soweit die dort definierten Zwecke dies zuslassen
    broader:
      - dpv:TechnicalOrganisationalMeasure
    inScheme:
      - de-gdng:lawfulness-classes
    isDefinedBy:
      - 'de-gdng:'
    subClassOf:
      - dpv:TechnicalOrganisationalMeasure
    term_status: accepted
    created:
      - '2025-10-13'
    contributor:
      - dpv_agent:person-christian-draeger
      - dpv_agent:person-christian-henke
      - dpv_agent:person-julian-flake
      - dpv_agent:person-matthias-lobe
    source:
      - '[[GDNG]] § 6(1)'
  - id: de-gdng:AuthorizedPerson
    prefLabel: Authorized Person
    prefLabel_de: Befugte Person
    definition: A natural person that, according to a rights and rolls concept, proccesses healtcare data
      at a healthcare facility pursuant to the legal basis of § 6(1) GDNG
    definition_de: Eine natürliche Person die nach einem Rechte- und Rollenkonzept die Weiterverarbeitung
      von Gesundheitsdaten nach der Rechtsgrundlage § 6(1) GDNG an einer Gesundheitseinrichtung durchführt
    broader:
      - dpv:LegalEntity
    inScheme:
      - de-gdng:actors-classes
    isDefinedBy:
      - 'de-gdng:'
    subClassOf:
      - dpv:LegalEntity
    term_status: accepted
    created:
      - '2025-10-13'
    contributor:
      - dpv_agent:person-julian-flake
    source:
      - '[[GDNG]] § 6(1)'
  - id: de-gdng:Controller
    prefLabel: Controller
    prefLabel_de: Datenschutzrechtlich verantwortliche Stelle
    broader:
      - eu-gdpr:Controller
    inScheme:
