  - id: de-gdng:DataLinkagePermission
    prefLabel: Data Linkage Permission
    prefLabel_de: Genehmigung zur Verknüpfung von pseudonymisierten Daten
    definition: A permission to link pseudonymized health data.
    definition_de: Eine Genehmigung zur Verknüpfung von pseudonymisierten Daten.
    broader:
      - dpv:Data
    inScheme:
      - de-gdng:linkage-classes
    isDefinedBy:
