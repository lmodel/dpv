  - id: eu-gdpr:ProportionalityAssessment
    rdf_type:
      - dpv:OrganisationalMeasure
    prefLabel: Proportionality Assessment
    definition: Proportionality is a general principle of EU law, which when applied for the GDPR requires
      striking a balance between the processing of personal data and the resulting impacts on rights.
      More simply, the processing should not result in a disproportionate impact on rights
    scopeNote:
      - The assessment of proportionality requires an assessment of suitability (represented by `eu-gdpr:SuitabilityAssessment`),
        necessity (represented by `eu-gdpr:NecessityAssessment`), and a balancing test (represented by
        `eu-gdpr:BalancingTest`). The outcome of the proportionality assessment is represented as an instance
        of `eu-gdpr:ProportionalityStatus`
    broader:
      - dpv:ImpactAssessment
    inScheme:
      - eu-gdpr:proportionality-classes
    isDefinedBy:
      - 'eu-gdpr:'
    term_status: accepted
