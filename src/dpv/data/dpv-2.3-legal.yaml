  - id: eu-gdpr:JustificationA12Delay
    rdf_type:
      - dpv:Justification
    prefLabel: Justification A12 - Delay
    definition: Justification that the request under A15-A22 is delayed
    scopeNote:
      - The justification is for when the initial process, which is to be completed within one month of
        receipt of the request, is delayed with Art.12-3 stating a duration of two further months where
        necessary taking into account the complexity and number of the requests. In such cases, the controller
        is needed to inform the data subject of the extension within one month of receipt of the request
        together with the reasons for the delay - which is done through this extension. Information about
        expected duration of response can be provided through use of dpv:hasDuration. The specific nature
        of delay can be expressed through use of eu-gdpr:A12ComplexityOfRequest or eu-gdpr:A12HighVolumeOfRequest
    broader:
      - justifications:DelayJustification
    inScheme:
      - eu-gdpr:rights-justifications-classes
