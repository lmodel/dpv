    definition: Legal basis based on data subject's given non-explicit express consent to the processing
      of his or her personal data for one or more specific purposes
    scopeNote:
      - 'Definition of consent: A data subject''s unambiguous/clear affirmative action that signifies
        an agreement to process their personal data (Rigo Wenning) . What is referred to as ''non-explicit
        consent'' here is also termed as ''regular'' consent in the Article 29 Working Party document
        "Guidelines on Consent under Regulation 2016/679 (wp259rev.01)". This is the legal basis that
        requires consent but not at the level of being ''explicit''.'
