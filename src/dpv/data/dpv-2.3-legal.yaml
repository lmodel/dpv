  - id: de-gdng:RightsRolesConcept
    prefLabel: Rights and Roles Concept
    prefLabel_de: Rechte- und Rollenkonzept
    definition: Personal data processed pursuant to the legal basis of § 6(1) GDNG may only be processed
      by natural persons at health institutions if a rights and roles concept is in place, which ensures
      that only authorised persons can process data, that the processing is logged, and that unauthorised
      processing can be sanctioned.
    definition_de: Nach der Rechtsgrundlage § 6(1) GDNG weitervarbeitete personenbezogene Daten dürfen
      von natürlichen Personen nur an Gesundheitseinrichtungen weiterverarbeitet werden, wenn dort ein
      Rechte- und Rollenkonzept vorliegt, das gewährleistet, das nur befugte Personen Daten weiterverarbeiten
      können, die Weiterverarbeitung rotokolliert und unbefugte Verarbeitungen geahndet werden kann
    broader:
      - dpv:TechnicalOrganisationalMeasure
    inScheme:
      - de-gdng:lawfulness-classes
    isDefinedBy:
      - 'de-gdng:'
    subClassOf:
      - dpv:TechnicalOrganisationalMeasure
    term_status: accepted
