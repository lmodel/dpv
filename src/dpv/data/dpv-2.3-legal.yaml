    source:
      - '[[GDNG]] § 4(2)'
  - id: de-gdng:DataLinkageRequest
    prefLabel: Data Linkage Request
    prefLabel_de: Antrag auf Verknüpfung von pseudonymisierten Daten
    definition: An application to get permission to link pseudonymized health data.
    definition_de: Ein Antrag auf Verknüpfung von pseudonymisierten Daten.
    broader:
      - dpv:Process
    inScheme:
      - de-gdng:linkage-classes
    isDefinedBy:
      - 'de-gdng:'
    subClassOf:
      - dpv:Process
    term_status: accepted
    created:
      - '2025-10-13'
    contributor:
      - dpv_agent:person-julian-flake
    source:
      - '[[GDNG]] § 4(2)'
  - id: de-gdng:DataLinkageRequestRecord
    prefLabel: Data Linkage Request Record
    prefLabel_de: Datenverknüpfungsantragsdaten
    definition: Data collected and produced by a Data Linkage Request
    definition_de: Im Rahmen eines Datenverknüpfungsantrags zu erfassende und anfallende Daten
    broader:
      - dpv:Data
    inScheme:
      - de-gdng:linkage-classes
    isDefinedBy:
      - 'de-gdng:'
    subClassOf:
      - dpv:Data
    term_status: accepted
    created:
      - '2025-10-13'
    contributor:
      - dpv_agent:person-julian-flake
    source:
      - '[[GDNG]] § 4(2)'
  - id: de-gdng:DataPlatform
    prefLabel: Data Platform
    prefLabel_de: Datenplattform
    definition: Networks of health data holders forming data platforms
    definition_de: Zusammenschlüsse von datenhaltenden Stellen zu Datenplattformen
    broader:
      - de-gdng:HealthDataHolder
    inScheme:
      - de-gdng:actors-classes
    isDefinedBy:
      - 'de-gdng:'
    subClassOf:
      - de-gdng:HealthDataHolder
    term_status: accepted
    created:
      - '2025-10-13'
    contributor:
      - dpv_agent:person-christian-draeger
      - dpv_agent:person-julian-flake
    source:
      - '[[GDNG]] § 2'
  - id: de-gdng:DataProcessingHealthcareFacility
    prefLabel: Data Processing Healthcare Facility
    prefLabel_de: Datenverarbeitende Gesundheitseinrichtung
    definition: Institution which process data for the purposes of preventative or occupational medicine,
      for the assessment of the employee's capacity to work, for medical diagnosis, or for the purposes
      of care or treatment in the health or social sector under the responsibility of members of a health
      profession, where such a profession requires state-regulated training for the exercise of the profession
      or the use of the professional title
    definition_de: Einrichtung, in der für Zwecke der Gesundheitsvorsorge oder der Arbeitsmedizin, für
      die Beurteilung der Arbeitsfähigkeit des Beschäftigten, für die medizinische Diagnostik oder für
      Zwecke der Versorgung oder Behandlung im Gesundheits- oder Sozialbereich Daten von oder unter der
      Verantwortung von Angehörigen eines Heilberufs verarbeitet werden, der für die Berufsausübung oder
      die Führung der Berufsbezeichnung eine staatlich geregelte Ausbildung erfordert
    broader:
      - dpv:Organisation
    inScheme:
      - de-gdng:actors-classes
    isDefinedBy:
      - 'de-gdng:'
    subClassOf:
      - dpv:Organisation
    term_status: accepted
    created:
      - '2025-10-13'
    contributor:
      - dpv_agent:person-christian-draeger
      - dpv_agent:person-julian-flake
    source:
      - '[[GDNG]] § 2'
  - id: de-gdng:DataSubject
    prefLabel: Data Subject
    prefLabel_de: Betroffene Person
    broader:
      - eu-gdpr:DataSubject
    inScheme:
      - de-gdng:actors-classes
    isDefinedBy:
      - 'de-gdng:'
    subClassOf:
