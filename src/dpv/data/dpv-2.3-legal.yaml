  - id: de-gdng:P6-1
    prefLabel: Legal Basis pursuant to § 6(1) GDNG
    prefLabel_de: Rechtsgrundlage nach § 6(1) GDNG
    definition: Processing of data on the basis of § 6(1) GDNG, taking into account all rights and obligations
      arising therefrom
    definition_de: Weiterverarbeitung von Daten auf Basis der Rechtsgrundlage § 6(1) GDNG unter Berücksichtigung
      aller sich daraus ergebenden Rechte und Pflichten
    scopeNote:
      - 'Compliance with all rights and obligations from § 6(1) GDNG must be ensured. These include, among
        others: Processing of lawfully stored data pursuant to Regulation (EU) 2016/679 Art. 9(2) points
        (h) and (i)  for the purposes of quality assurance, patient safety, or for medical, rehabilitative
        and nursing research or for statistical purposes, including health reporting. Processed personal
        data shall be pseudonymised and, as soon as possible, anonymised. Further processing by natural
        persons requires a rights and roles concept. Further processed data shall be erased no later than
        after 30 years. § 14 of the Transplantation Act shall be observed'
    broader:
      - dpv:LegalBasis
    inScheme:
      - de-gdng:lawfulness-classes
    isDefinedBy:
      - 'de-gdng:'
    subClassOf:
      - dpv:LegalBasis
    term_status: accepted
    created:
      - '2026-02-09'
    contributor:
      - dpv_agent:person-christian-draeger
      - dpv_agent:person-christian-henke
      - dpv_agent:person-julian-flake
      - dpv_agent:person-matthias-lobe
    source:
      - '[[GDNG]] § 6(1)'
