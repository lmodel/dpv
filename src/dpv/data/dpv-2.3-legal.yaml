    contributor:
      - dpv_agent:person-christian-draeger
      - dpv_agent:person-julian-flake
    source:
      - '[[GDNG]] § 2'
  - id: de-gdng:DataLinkage
    prefLabel: Data Linkage
    prefLabel_de: Datenverknüpfung
    definition: Linkage of pseudonymized health data.
    definition_de: Verknüpfung von pseudonymisierten Gesundheitsdaten.
    broader:
      - dpv:Processing
    inScheme:
      - de-gdng:linkage-classes
    isDefinedBy:
      - 'de-gdng:'
    subClassOf:
      - dpv:Processing
    term_status: accepted
