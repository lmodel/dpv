    isDefinedBy:
      - 'de-gdng:'
    subClassOf:
      - eu-gdpr:Controller
    term_status: accepted
    created:
      - '2026-02-08'
    contributor:
      - dpv_agent:person-christian-draeger
      - dpv_agent:person-julian-flake
    source:
      - '[[GDNG]] § 6(3)'
  - id: de-gdng:DPAApproval
    prefLabel: Approval of competent data protection authority
    prefLabel_de: Zustimmung der zuständigen Datenschutzaufsichtsbehörde
    broader:
      - dpv:LegalMeasure
    inScheme:
      - de-gdng:lawfulness-classes
    isDefinedBy:
