    contributor:
      - dpv_agent:person-julian-flake
    source:
      - '[[GDNG]] § 3(1)'
  - id: de-gdng:DataInfrastructure
    prefLabel: Data Infrastructure
    prefLabel_de: Dateninfrastruktur
    definition: Networks of health data holders forming data infrastructures
    definition_de: Zusammenschlüsse von datenhaltenden Stellen zu Dateninfrastrukturen
    broader:
      - de-gdng:HealthDataHolder
    inScheme:
      - de-gdng:actors-classes
    isDefinedBy:
