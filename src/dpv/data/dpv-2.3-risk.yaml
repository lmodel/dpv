        url: https://www.iso.org/standard/75281.html
  - id: risk:RightsLimited
    rdf_type:
      - dpv:RiskConcept
      - risk:PotentialConsequence
      - risk:PotentialImpact
      - risk:PotentialRisk
    prefLabel: Rights Limited
    definition: A limitation or restrictions on the scope or exercise of rights
    scopeNote:
      - This concept was called "LimitationOfRights" in DPV 2.0. The limitation refers to the applicability
        and scope of the right, and not in the ability to exercise that right. Limitation is therefore
        fulfilment of the right and its obligations - but for a scope other than what was intended or
        expected. Though specified as a plural i.e. 'rights', this concept can be applied to a singular
        right
    broader:
      - risk:RightsImpact
    inScheme:
      - risk:risk-taxonomy-classes
    isDefinedBy:
      - 'risk:'
    term_status: accepted
    created:
      - '2022-08-18'
    modified: '2024-08-16'
    contributor:
      - dpv_agent:person-georg-p-krog
      - dpv_agent:person-harshvardhan-j-pandit
  - id: risk:RightsObstructed
    rdf_type:
      - dpv:RiskConcept
      - risk:PotentialConsequence
      - risk:PotentialImpact
      - risk:PotentialRisk
    prefLabel: Rights Obstructed
    definition: Interference with or blocking of the exercise of rights
    scopeNote:
      - In obstruction, the right is not denied, limited, or unfulfilled - but the requirements to enable
        exercise of the rights are increased to the point of discouraging or obstructing the exercise
        of that right. Though specified as a plural i.e. 'rights', this concept can be applied to a singular
        right
    broader:
      - risk:RightsImpact
    inScheme:
      - risk:risk-taxonomy-classes
    isDefinedBy:
      - 'risk:'
    term_status: accepted
    created:
      - '2024-12-17'
  - id: risk:RightsUnfulfilled
    rdf_type:
      - dpv:RiskConcept
      - risk:PotentialConsequence
      - risk:PotentialImpact
      - risk:PotentialRisk
    prefLabel: Rights Unfulfilled
    definition: Failure to meet or complete the fulfilment of rights
    scopeNote:
      - Here unfulfilment refers to non-completion of the right's obligations and processes. Though specified
        as a plural i.e. 'rights', this concept can be applied to a singular right
    broader:
      - risk:RightsImpact
    inScheme:
      - risk:risk-taxonomy-classes
    isDefinedBy:
      - 'risk:'
    term_status: accepted
    created:
      - '2024-12-17'
