    rdf_type:
      - dpv:RiskConcept
      - risk:PotentialConsequence
      - risk:PotentialImpact
      - risk:PotentialRisk
    prefLabel: Rights Exercise Prevented
    definition: Actions or measures that prevent an individual or group from exercising their legal rights.
    scopeNote:
      - This concept was called "PreventExercisingOfRights" in DPV 2.0. Violation of a right is a bar
        for actionable actions by an authority. Other impacts on right may be found to construe a violation
        of the right, but that is not necessarily always the case i.e. not all impacts are violations
        of a right. Though specified as a plural i.e. 'rights', this concept can be applied to a singular
        right
    broader:
      - risk:RightsImpact
    inScheme:
      - risk:risk-taxonomy-classes
    isDefinedBy:
      - 'risk:'
    term_status: accepted
    created:
