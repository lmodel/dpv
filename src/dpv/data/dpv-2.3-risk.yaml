      - dpv_agent:person-harshvardhan-j-pandit
  - id: risk:RightsImpact
    rdf_type:
      - dpv:RiskConcept
      - risk:PotentialConsequence
      - risk:PotentialImpact
      - risk:PotentialRisk
    prefLabel: Rights Impact
    definition: Concept representing Impact to Rights
    scopeNote:
      - This concept was called "ImpactToRights" in DPV 2.0. Though specified as a plural i.e. 'rights',
        this concept can be applied to a singular right
    broader:
      - risk:SocietalRiskConcept
    inScheme:
      - risk:risk-taxonomy-classes
    isDefinedBy:
      - 'risk:'
