    rdf_type:
      - dpv:RiskConcept
      - risk:PotentialConsequence
      - risk:PotentialImpact
      - risk:PotentialRisk
    prefLabel: Rights Eroded
    definition: The gradual weakening or reduction of the scope and protection of rights
    scopeNote:
      - Erosion of rights typically only applies to passive rights which always apply, since for active
        rights the exercise of that right is what enables it. An active right can be eroded over time
        it is limited consistently and increasingly such that the scope of the right is reduced over time.
        Though specified as a plural i.e. 'rights', this concept can be applied to a singular right
    broader:
      - risk:RightsImpact
    inScheme:
      - risk:risk-taxonomy-classes
    isDefinedBy:
