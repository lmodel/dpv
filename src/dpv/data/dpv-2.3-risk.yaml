      - risk:RiskControl
    prefLabel: Transfer Control
    definition: Control that aims to transfer the event (or risk) to another context or entity
    scopeNote:
      - Transfer implies moving (physically or logically) the event to another context or entity. While
        Risk Management methods indicate risk transfer as occurring between entities, this concept is
        defined more broadly by including 'context or entity' so as to enable modelling cases where the
        transfer takes place between processes - which may be managed by the same or different entity.
        Additionally, typical use of 'Transfer' implies a formal mechanism such as an agreement, which
        is absent from this concept. If only partial responsibility is transferred, such as for a specific
        measure, then this can be considered as an instance of sharing the risk - for which risk:ShareControl
        is provided
    broader:
      - risk:RiskControl
    inScheme:
      - risk:risk-controls-classes
    isDefinedBy:
      - 'risk:'
    term_status: accepted
    created:
      - '2025-01-06'
    contributor:
      - dpv_agent:person-harshvardhan-j-pandit
  - id: risk:TransparencyControl
    rdf_type:
      - risk:RiskControl
    prefLabel: Transparency Control
    definition: Control that provides information about an event
    scopeNote:
      - Transparency refers to the availability of information, whether for the same or different entity
        in relation to who establishes and operates the control, and where transparency implies having
        the means to obtain and use information about an event
    broader:
      - risk:MonitorControl
    inScheme:
      - risk:risk-controls-classes
    isDefinedBy:
      - 'risk:'
    term_status: accepted
    created:
      - '2025-01-06'
    contributor:
      - dpv_agent:person-delaram-golpayegani
      - dpv_agent:person-harshvardhan-j-pandit
