  - id: risk:InterruptionControl
    rdf_type:
      - risk:RiskControl
    prefLabel: Interruption Control
    definition: Control that interrupts an event without removing the possibility for it to be resumed
      and where the aim is to stop the event
    scopeNote:
      - Interruption refers to the event being temporarily halted, such as an emergency measure while
        further suitable measures are identified and put in place. To indicate stopping the event completely
        rather than a temporary interruption, see risk:RemediationControl which fixes the underlying issue
        and risk:EliminationControl which prevents the event from occurring
    broader:
      - risk:ReductionControl
    inScheme:
      - risk:risk-controls-classes
    isDefinedBy:
      - 'risk:'
    term_status: accepted
    created:
      - '2025-01-06'
    contributor:
      - dpv_agent:person-delaram-golpayegani
      - dpv_agent:person-harshvardhan-j-pandit
  - id: risk:InterventionControl
    rdf_type:
      - risk:RiskControl
    prefLabel: Intervention Control
    definition: Control that intervenes in the operations of the event to change some context with the
      aim of changing the event or the effects
    scopeNote:
      - Intervention implies taking steps to resolve the effects or to prevent further escalation while
        the event is still ongoing. For halting the event, see risk:InterruptionControl, for recovering
        and undoing the effects, see risk:RecoveryControl and risk:ReversalControl. Intervention is a
        temporary or stop-gap measure which is used while the event is ongoing to prevent it from escalating
        or creating additional issues
    broader:
      - risk:ReductionControl
    inScheme:
      - risk:risk-controls-classes
    isDefinedBy:
      - 'risk:'
    term_status: accepted
    created:
      - '2025-01-06'
    contributor:
      - dpv_agent:person-harshvardhan-j-pandit
  - id: risk:InvestigationControl
    rdf_type:
      - risk:RiskControl
    prefLabel: Investigation Control
    definition: Control that identifies information through an investigative process about an event and
      its effects after it has occurred
    scopeNote:
      - Investigative controls are used to identify information about an event and its effects which can
        be used to identify further effective measures to address them, and to identify processes to remedy
        and recover from it. Investigation control therefore is focused on analysis of an event after
        its occurrence with the goal of identifying applicability and effectiveness of other controls
        to address it
    broader:
      - risk:ReactiveControl
    inScheme:
      - risk:risk-controls-classes
    isDefinedBy:
      - 'risk:'
    term_status: accepted
    created:
      - '2025-01-06'
    contributor:
      - dpv_agent:person-harshvardhan-j-pandit
