  - id: risk:EliminationControl
    rdf_type:
      - risk:RiskControl
    prefLabel: Elimination Control
    definition: Control that eliminates an event entirely such that the event does not occur
    scopeNote:
      - Elimination requires the event's likelihood to be reduced to zero such that the event cannot occur
        in the context. This can be done by establishing methods to prevent the event from occurring (e.g.
        gatekeeping filters) or by changing the underlying context (e.g. replacing faulty device). The
        difference between risk:ModificationControl and risk:EliminationControl is that modification works
        to change the event characteristics whereas elimination works on the context to prevent the event
    broader:
      - risk:AvoidanceControl
    inScheme:
      - risk:risk-controls-classes
