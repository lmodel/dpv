  - id: sector-health:ReuseCompatibility
    prefLabel: ReuseCompatibility
    definition: Status indicating whether the reuse of health data is compatible for given context
    scopeNote:
      - Compatibility refers to whether two contexts, such as dpv:Process instances, are compatible with
        each other based on a criteria which is not defined by the concept. This criteria can be based
        on requirements from law, such as GDPR's purpose compatibility or can be based on privacy norms
        such as contextual integrity. To express such interpretations, further concepts should be expanded
        from this base concept
    broader:
      - dpv:ReuseCompatibility
    inScheme:
      - sector-health:status-classes
    isDefinedBy:
      - 'sector-health:'
    subClassOf:
      - dpv:ReuseCompatibility
    term_status: accepted
    created:
