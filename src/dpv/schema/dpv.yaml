classes:

  DpvCatalogue:
    title: Catalogue
    tree_root: true
    description: >-
      One part of a DPV release: one namespace family's vocabularies and terms, its contributors or
      its examples.
    slots:
      - concepts
    attributes:
      edition:
        title: Edition
        description: The DPV release the part belongs to.
        required: true
        slot_uri: dcterms:isVersionOf
      family:
        title: Family
        description: Which part of the release this is.
        required: true
        range: DpvFamily
      vocabularies:
        title: Vocabularies
        description: The family's vocabularies, as each one's Turtle file describes it.
        range: DpvVocabulary
        multivalued: true
        inlined_as_list: true
      concept_schemes:
        title: Concept Schemes
        description: The lists of terms the family's vocabularies keep.
        range: DpvConceptScheme
        multivalued: true
        inlined_as_list: true
      properties:
        title: Properties
        description: The family's properties.
        range: DpvProperty
        multivalued: true
        inlined_as_list: true
      agents:
        title: Agents
        description: The people and organizations DPV names as contributors.
        range: DpvAgent
        multivalued: true
        inlined_as_list: true
      examples:
        title: Examples
        description: DPV's examples.
        range: DpvExample
        multivalued: true
        inlined_as_list: true

slots:

  concepts:
    title: Concepts
    description: The family's concepts, each a record of its kinds.
    range: DpvConcept
    multivalued: true
    inlined_as_list: true

enums:

  DpvFamily:
    title: Family
    description: The parts of a release, one file each.
    permissible_values:
      core:
        title: Core
        description: The vocabulary at https://w3id.org/dpv and the terms it adopts from others.
      pd:
        title: Personal Data
        description: The personal data vocabulary.
      tech:
        title: Technology
        description: The technology vocabulary.
      ai:
        title: Artificial Intelligence
        description: The artificial intelligence vocabulary.
      risk:
        title: Risk
        description: The risk vocabulary.
      justifications:
        title: Justifications
        description: The justifications vocabulary.
      loc:
        title: Locations
        description: The locations vocabulary.
      legal:
        title: Laws and Authorities
        description: The legal vocabularies, of each jurisdiction and each EU law.
      sector:
        title: Sectors
        description: The sector vocabularies.
      standards:
        title: Standards
        description: The vocabularies of other standards.
      agents:
        title: Agents
        description: The contributors.
      examples:
        title: Examples
        description: The examples.
