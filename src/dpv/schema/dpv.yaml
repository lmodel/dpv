---
id: https://w3id.org/lmodel/dpv
name: dpv
title: Data Privacy Vocabulary (DPV)
description: >-
  A LinkML model of the Data Privacy Vocabulary (DPV) 2.3 of the W3C Data Privacy Vocabularies and
  Controls Community Group. DPV states each concept as a class and as an instance of a broader
  concept, so the model holds its terms as records: each concept that terms are instances of is a
  class, each property is a slot under its own IRI, and every term of DPV's vocabularies is a record
  that validates against them.
version: "2.3"
source: https://w3id.org/dpv/2.3
license: Apache-2.0
keywords:
  - privacy
  - data protection
  - personal data
  - DPV
  - GDPR
  - vocabulary
see_also:
  - https://lmodel.github.io/dpv
  - https://w3id.org/dpv
annotations:
  upstream_tag: dpv-2.3
  upstream_commit: cbcd21567808812677eeb3bb0f05b2ff2c2211a5
  upstream_release_date: "2026-02-28"
  upstream_copyright: Copyright the Contributors to the Data Privacy Vocabulary (DPV)
  upstream_license: https://www.w3.org/copyright/software-license-2023/
comments:
  - >-
    The version is the DPV release the schema renders. upstream/ holds its Turtle files unchanged,
    scripts/dpv_to_linkml.py writes the terms, the kinds and the catalogue from them, and
    scripts/check_upstream_release.py reports when they move.
