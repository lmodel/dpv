    description: Indicates the threat (subject) exploits the indicated vulnerability (object)
    slot_uri: risk:exploitsVulnerability
    range: DpvTerm
    pattern: ^[A-Za-z_][A-Za-z0-9_+.-]*:\S*$
    inlined: false
    multivalued: true
  format:
    title: dct:format
    description: The property dcterms:format.
    slot_uri: dcterms:format
    range: string
    multivalued: true
    comments:
      - Also used for specifying the format of provided information, for example a CSV dataset
  hasAI:
    title: has AI
    description: Indicates the use of AI for the associated context
    slot_uri: ai:hasAI
    range: DpvTerm
    pattern: ^[A-Za-z_][A-Za-z0-9_+.-]*:\S*$
    inlined: false
    multivalued: true
    is_a: isImplementedUsingTechnology
  hasAISystem:
