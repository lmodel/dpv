classes:
  DpvTerm:
    title: Term
    abstract: true
    description: One thing DPV's vocabularies state, or a thing a use case describes with them, as a record
      under its own IRI.
    slots:
      - id
      - rdf_type
      - prefLabel
      - prefLabel_de
      - definition
      - definition_de
      - scopeNote
      - broader
      - related
      - inScheme
      - sameAs
      - isDefinedBy
      - subClassOf
      - example
      - exactMatch
      - term_status
      - created
      - modified
      - contributor
      - source
      - source_page
      - homepage
      - value
      - temporal
  DpvConcept:
    title: Concept
    is_a: DpvTerm
    class_uri: skos:Concept
    description: A term DPV states as a concept and a class. Its rdf_type names the concepts it is an
      instance of, each a class of this schema, where DPV states one.
    comments:
      - It holds the DPV properties some term of the vocabularies states. A thing a use case describes
        takes DpvResource, which holds them all.
    slots:
      - eu_aiact_hasRiskLevel
      - hasApplicableLaw
      - hasAuthority
      - hasHumanDescription
      - hasInverseJurisdiction
      - hasJurisdiction
      - hasJustification
      - hasLikelihood
      - hasObligation
      - hasPermission
      - hasProhibition
      - hasRight
      - hasRiskLevel
      - hasSeverity
      - iso_alpha2
      - iso_alpha3
      - iso_numeric
      - un_m49
  DpvProperty:
    title: Property
    is_a: DpvTerm
    class_uri: rdf:Property
    description: A property DPV states, with the classes it names as its usual subjects and values. Every
      property is also a slot of DpvResource.
    slots:
      - subPropertyOf
      - domainIncludes
      - rangeIncludes
  DpvResource:
    title: Resource
    is_a: DpvTerm
    class_uri: rdfs:Resource
    description: A thing a use case describes with DPV, such as a process, holding any DPV property, because
      DPV states none as limited to a class.
    comments:
      - DPV's domainIncludes and rangeIncludes say what a property usually joins, not what it must, so
        a validator cannot refuse a value on them. tests/dpv_rules.py reports a value that names nothing,
        and tests/test_examples.py lists where DPV's own examples leave those classes.
    slots:
