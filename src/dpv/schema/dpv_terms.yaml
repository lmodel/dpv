  DpvExample:
    title: Example
    class_uri: dex:Example
    description: 'One of DPV''s examples: what it shows, and the statements its Turtle file makes, as
      one resource per subject.'
    comments:
      - Every file leaves its prefixes out, so a parser reads it with the prefixes of the vocabularies
        beside it. An example may show two ways of saying one thing, so its resources are what the file
        states, not one consistent account.
    slots:
      - id
      - title
      - description
      - format
      - source
      - subject
      - created
      - modified
      - temporal
      - contributor
      - term_status
    attributes:
      turtle_fault:
        title: Turtle Fault
        description: What stops a parser reading the example's file, where the file does not parse.
      resources:
        title: Resources
        description: Each subject the example's file states, with what it says about it.
        range: DpvResource
        multivalued: true
        inlined_as_list: true
    slot_usage:
      title:
        required: true
  DpvStatement:
    title: Statement
    description: 'One statement of a resource that its keys cannot hold: a predicate with no slot, or
      a value not in the form its slot takes.'
    slots:
      - datatype
    attributes:
      predicate:
        title: Predicate
        description: The predicate, as a CURIE or an IRI.
        range: uriorcurie
        pattern: ^[A-Za-z_][A-Za-z0-9_+.-]*:\S*$
        required: true
        slot_uri: rdf:predicate
      reference:
        title: Reference
        description: The object, when it names a resource.
        range: uriorcurie
        pattern: ^[A-Za-z_][A-Za-z0-9_+.-]*:\S*$
        slot_uri: rdf:object
      literal:
        title: Literal
        description: The object, when it is a literal, in its lexical form.
        slot_uri: rdf:value
      language:
        title: Language
        description: The literal's language tag.
slots:
  accessRights:
    title: dct:accessRights
    description: The property dcterms:accessRights.
    slot_uri: dcterms:accessRights
    range: DpvTerm
    pattern: ^[A-Za-z_][A-Za-z0-9_+.-]*:\S*$
    inlined: false
    multivalued: true
    comments:
      - Also used for specifying constraints on access associated with Rights Exercising (e.g. User must
        log in) or access to provided data (e.g. access via link)
  ai_hasCapability:
    title: has capability
    description: Indicates the use of AI capability for the associated context
    slot_uri: ai:hasCapability
    range: DpvTerm
    pattern: ^[A-Za-z_][A-Za-z0-9_+.-]*:\S*$
    inlined: false
    multivalued: true
    is_a: hasAI
  ai_hasData:
    title: has data
    description: Associates data with an AI system or model or implementation
    slot_uri: ai:hasData
    range: DpvTerm
    pattern: ^[A-Za-z_][A-Za-z0-9_+.-]*:\S*$
    inlined: false
    multivalued: true
    is_a: hasData
  ai_hasModel:
    title: has model
    description: Indicates the use of an AI model for the associated context
    slot_uri: ai:hasModel
    range: DpvTerm
    pattern: ^[A-Za-z_][A-Za-z0-9_+.-]*:\S*$
    inlined: false
    multivalued: true
    is_a: hasAI
  avoids:
    title: avoids
    description: Indicates the event or action is avoided by the specified control
    slot_uri: risk:avoids
    range: DpvTerm
    pattern: ^[A-Za-z_][A-Za-z0-9_+.-]*:\S*$
    inlined: false
    multivalued: true
    is_a: reduces
  causedByThreat:
    title: caused by threat
    description: Indicates the cause of associated context (subject) was the indicated threat (object)
    slot_uri: risk:causedByThreat
    range: DpvTerm
    pattern: ^[A-Za-z_][A-Za-z0-9_+.-]*:\S*$
    inlined: false
    multivalued: true
  causedByVulnerability:
    title: caused by vulnerability
    description: Indicates the associated context (subject) is caused by the indicated vulnerability (object)
    slot_uri: risk:causedByVulnerability
    range: DpvTerm
    pattern: ^[A-Za-z_][A-Za-z0-9_+.-]*:\S*$
    inlined: false
    multivalued: true
  contains:
    title: contains
    description: Indicates the specified event or action is contained by this control
    slot_uri: risk:contains
    range: DpvTerm
    pattern: ^[A-Za-z_][A-Za-z0-9_+.-]*:\S*$
    inlined: false
    multivalued: true
    is_a: controls
  controls:
    title: control
    description: Indicates this control manages specified risk concept event or action, such as for risk
      sources, risks, consequences, and impacts
    slot_uri: risk:controls
    range: DpvTerm
    pattern: ^[A-Za-z_][A-Za-z0-9_+.-]*:\S*$
    inlined: false
    multivalued: true
  coverage:
    title: dct:coverage
    description: The property dcterms:coverage.
    slot_uri: dcterms:coverage
    range: DpvTerm
    pattern: ^[A-Za-z_][A-Za-z0-9_+.-]*:\S*$
    inlined: false
    multivalued: true
    comments:
      - For expressing coverage (e.g. jurisdictions, products, services) of the DPIA document or process.
        For temporal coverage, please see dct:temporal. The coverage can be expressed using dpv:Process,
        or using another concept, or even be a link or reference to a document, or a textual description
  dateAccepted:
    title: dct:dateAccepted
    description: The property dcterms:dateAccepted.
    slot_uri: dcterms:dateAccepted
    range: string
    multivalued: true
    comments:
      - For expressing when the documentation (e.g. DPIA Necessity Assessment, or DPIA Procedure, or DPIA
        outcome) was accepted through audit or approval
  dateSubmitted:
    title: dct:dateSubmitted
    description: The property dcterms:dateSubmitted.
    slot_uri: dcterms:dateSubmitted
    range: string
    multivalued: true
    comments:
      - For expressing when the documentation (e.g. DPIA Necessity Assessment, or DPIA Procedure, or DPIA
        outcome) was submitted for audit or approval
  de_gdng_hasDataHolder:
    title: has Data Holder
    description: something is related to a data holder
    slot_uri: de-gdng:hasDataHolder
    range: DpvTerm
    pattern: ^[A-Za-z_][A-Za-z0-9_+.-]*:\S*$
    inlined: false
    multivalued: true
