id: dpv:ConsentExpired
rdf_type:
  - dpv:ConsentStatus
prefLabel: Consent Expired
definition: The state where the temporal or contextual validity of consent has 'expired'
scopeNote:
  - An example of this state is when the obtained consent has been assigned a duration - which has lapsed
    or 'expired', making it invalid to be used further for processing data
