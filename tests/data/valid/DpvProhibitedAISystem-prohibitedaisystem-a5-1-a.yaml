  - eu-aiact:ProhibitedAISystem
prefLabel: Prohibited AI System - Article 5(1a)
definition: Prohibited AI system according to Article 5(1a) of the AI Act, indicating an AI system that
  deploys subliminal techniques beyond a person’s consciousness or purposefully manipulative or deceptive
  techniques, with the objective, or the effect of materially distorting the behaviour of a person or
  a group of persons by appreciably impairing their ability to make an informed decision, thereby causing
  them to take a decision that they would not have otherwise taken in a manner that causes or is reasonably
  likely to cause that person, another person or group of persons significant harm.
