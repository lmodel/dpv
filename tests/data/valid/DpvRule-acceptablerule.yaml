id: dpv:AcceptableRule
rdf_type:
  - dpv:Rule
prefLabel: Acceptable Rule
definition: A rule that is acceptable where it is either desirable if it occurs or it is not unacceptable
  if it does
scopeNote:
  - Acceptable is a subjective concept that enables distinguishing with "unacceptable". By itself it does
    not signal any permission or obligation - for which further specific concepts are defined
